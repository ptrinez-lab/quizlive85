/* ================= Participant ================= */
class Joueur {
  constructor({pin = '', integre = false} = {}){
    this.integre = integre; this.pin = pin; this.hote = null; this.st = null; this.err = ''; this.key = ''; this.sel = []; this.horsLigne = false; this.t = null; this.unsub = null;
    this.cred = integre ? null : lire('ql85_joueur');
    if (this.cred && pin && this.cred.pin && this.cred.pin !== pin) this.cred = null; // lien vers une autre session
    this.etape = this.cred ? 'jeu' : 'pin';
    if (this.cred) this.demarrer();
  }
  monter(hote){ this.hote = hote; this.key = ''; this.rendre(); }
  arreter(){ clearTimeout(this.t); if (this.unsub) this.unsub(); this.unsub = null; }
  async validerPin(v){
    v = String(v || '').replace(/\D/g, ''); this.pin = v;
    if (v.length !== 6){ this.err = 'Le code PIN compte 6 chiffres.'; return this.rendre(); }
    try { const r = await api.checkPin(v); if (!r.ok){ this.err = MSG.pin; return this.rendre(); }
      this.anonyme = r.anonyme; this.titre = r.titre; this.err = ''; this.etape = 'pseudo';
      this.pseudo = r.anonyme ? '' : (lire('ql85_pseudo') || ''); this.rendre();
    } catch(e){ this.err = 'Connexion impossible. Vérifiez le réseau et réessayez.'; this.rendre(); }
  }
  async rejoindre(nom){
    try {
      const r = await api.joinSession(this.pin, nom);
      if (!r.ok){ this.err = MSG[r.reason] || 'Impossible de rejoindre.'; this.pseudo = nom; return this.rendre(); }
      this.cred = {sid:r.session_id, pid:r.player_id, token:r.token, pin:this.pin};
      if (!this.integre){ ecrire('ql85_joueur', this.cred); if (!this.anonyme) ecrire('ql85_pseudo', r.nickname); }
      this.err = ''; this.etape = 'jeu'; son('clic'); vibre(20); this.demarrer();
    } catch(e){ this.err = 'Connexion impossible. Vérifiez le réseau et réessayez.'; this.rendre(); }
  }
  demarrer(){ this.unsub = api.subscribe(this.cred.sid, () => this.rafraichir()); this.rafraichir(); }
  async rafraichir(){
    clearTimeout(this.t);
    if (!this.cred) return;
    const seq = this.seq = (this.seq || 0) + 1;
    try {
      const st = await api.playerState(this.cred);
      if (seq !== this.seq) return; // une requête plus récente est partie entre-temps
      if (!st.ok){ return this.quitter(MSG.inconnu); }
      this.horsLigne = false; this.appliquer(st);
    } catch(e){ if (!this.horsLigne){ this.horsLigne = true; this.key = ''; this.rendre(); } }
    if (this.cred) this.t = setTimeout(() => this.rafraichir(), this.delai());
  }
  delai(){
    const st = this.st;
    if (this.horsLigne) return 2000;
    if (st && st.phase === 'podium') return 15000;
    if (st && st.phase === 'question') return 2000;
    return api.tempsReelOk(this.cred.sid) ? 3000 : 2000;
  }
  phaseVue(){
    const st = this.st; if (!st) return 'chargement';
    if (st.phase === 'question' && st.remaining_ms != null && this.deadline - performance.now() > st.duration_ms) return 'intro';
    return st.phase;
  }
  appliquer(st){
    const prev = this.st; this.st = st;
    if (st.remaining_ms != null) this.deadline = performance.now() + st.remaining_ms;
    if (prev && prev.q_index !== st.q_index) this.sel = [];
    const key = [this.phaseVue(), st.q_index, st.paused, !!st.my_choice, st.phase === 'attente' ? st.players : ''].join('|');
    if (key !== this.key){
      this.key = key; this.rendre();
      if (st.phase === 'revel' && prev && prev.phase === 'question' && st.result && st.result.repondu && st.question.type !== 'sondage'){ son(st.result.correct ? 'ok' : 'ko'); vibre(st.result.correct ? [30,40,30] : 120); }
    }
  }
  quitter(msg){ this.arreter(); this.cred = null; this.st = null; if (!this.integre) ecrire('ql85_joueur', null); this.etape = 'pin'; this.err = msg || ''; this.key = ''; this.rendre(); }
  async repondre(choix){
    const st = this.st; if (!st || st.my_choice) return;
    st.my_choice = choix; this.key = ''; this.seq = (this.seq || 0) + 1; this.appliquer(st);
    son('clic'); vibre(25);
    try {
      const r = await api.submitAnswer(this.cred, st.q_index, choix);
      if (!r.ok && r.reason !== 'deja'){ delete st.my_choice; this.err = MSG[r.reason] || ''; this.key = ''; this.rendre(); setTimeout(() => { this.err = ''; }, 3000); }
    } catch(e){ delete st.my_choice; this.err = 'Réponse non envoyée : touchez à nouveau.'; this.key = ''; this.rendre(); }
    this.rafraichir();
  }
  tick(now){
    const st = this.st; if (!st || st.phase !== 'question' || !this.hote) return;
    const vue = this.phaseVue();
    if (this.key.split('|')[0] !== vue){ this.key = ''; this.appliquer(st); return; }
    const b = this.hote.querySelector('.chrono-tel i');
    if (b){ const rest = st.paused ? st.remaining_ms : this.deadline - now, v = Math.max(0, Math.min(1, rest / st.duration_ms));
      b.style.transform = `scaleX(${v})`; b.style.background = v < .17 ? 'var(--ko)' : v < .34 ? 'var(--or)' : 'var(--ok)';
      if (rest < -1800 && !this.relance){ this.relance = true; setTimeout(() => { this.relance = false; this.rafraichir(); }, 300); } }
  }
  rendre(){
    const el = this.hote; if (!el) return;
    let h = '';
    if (this.etape === 'pin'){
      h = `<div class="centre">${CHARTE.logo ? `<img class="logo-tel-img" src="${CHARTE.logo}" alt="Sapeurs-pompiers de la Vendée">` : ''}<div class="logo-tel">QUIZ LIVE <span>85</span></div>
        <form id="f-pin" style="width:100%;display:flex;flex-direction:column;gap:12px">
          <label for="pin-in" class="petit">Code PIN affiché à l’écran</label>
          <input id="pin-in" class="pin-in num" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" value="${esc(this.pin)}">
          ${this.err ? `<div class="erreur" role="alert">${esc(this.err)}</div>` : ''}
          <button class="btn rouge gros" type="submit">Valider</button>
        </form>
        ${this.integre ? `<button class="lien" data-act="j-qr">J’ai scanné le QR code</button>` : ''}</div>`;
    } else if (this.etape === 'pseudo'){
      h = this.anonyme ? `<div class="centre"><div class="petit">${esc(this.titre || '')}</div><div class="logo-tel" style="font-size:30px">Session anonyme</div>
          <p class="petit">Un pseudonyme vous sera attribué. Aucune donnée personnelle n’est demandée.</p>
          ${this.err ? `<div class="erreur" role="alert">${esc(this.err)}</div>` : ''}<button class="btn rouge gros" data-act="j-rejoindre">Rejoindre</button></div>`
      : `<div class="centre"><div class="petit">${esc(this.titre || '')}</div><div class="logo-tel" style="font-size:30px">Votre pseudo</div>
        <form id="f-pseudo" style="width:100%;display:flex;flex-direction:column;gap:12px">
          <label for="pseudo-in" class="petit">Prénom ou pseudonyme, visible par la salle</label>
          <input id="pseudo-in" class="pseudo-in" maxlength="16" autocomplete="off" placeholder="Ex. Chloé" value="${esc(this.pseudo || '')}">
          ${this.err ? `<div class="erreur" role="alert">${esc(this.err)}</div>` : ''}
          <button class="lien" type="button" data-act="j-alea">Choisir un pseudo au hasard</button>
          <button class="btn rouge gros" type="submit">C’est parti</button></form>
        <p class="petit">Aucun compte requis. Votre pseudo n’est utilisé que pour cette session de formation.</p></div>`;
    } else {
      const st = this.st, vue = this.phaseVue(), q = st && st.question;
      const entete = st ? `<div class="entete-tel"><span><b>${esc(st.nickname)}</b></span><span class="num">${st.competition ? fmt(st.score) + ' pts' : ''}</span></div>` : '';
      if (!st) h = `<div class="centre"><div class="radar"><i></i></div><p class="petit">Connexion à la session…</p></div>`;
      else if (vue === 'attente') h = entete + `<div class="centre"><div class="radar"><i></i></div><div class="badge-pseudo">${esc(st.nickname)}</div><p>Vous êtes dans la salle.<br><span class="petit">Le formateur va lancer le quiz. ${st.players} connecté${st.players > 1 ? 's' : ''}.</span></p></div>`;
      else if (vue === 'intro') h = entete + `<div class="centre"><div class="logo-tel" style="font-size:56px">${st.q_index+1}<span>/${st.total}</span></div><p class="petit">${TYPES[q.type]}</p><p style="font-family:var(--display);font-size:26px;font-weight:800;font-style:italic">PRÊT ?</p></div>`;
      else if (vue === 'question'){
        if (st.my_choice) h = entete + `<div class="centre"><div class="petit">Réponse enregistrée</div>${st.my_choice.map(i => `<div class="reponse-envoyee c${i}"><span class="l">${LETTRES[i]}</span><span>${esc(q.reponses[i])}</span></div>`).join('')}<p class="petit">En attente de la fin du chrono…</p></div>`;
        else h = entete + `${st.question_tel ? `<div class="q-tel">${esc(q.texte)}</div>` : `<div class="q-tel" style="font-size:15px;color:var(--texte-2)">Regardez l’écran projeté</div>`}
          <div class="chrono-tel"><i></i></div>
          ${this.err ? `<div class="erreur" role="alert" style="margin-bottom:8px">${esc(this.err)}</div>` : ''}
          <div class="grille-rep ${q.reponses.length === 2 ? 'deux' : ''}">${q.reponses.map((x,i) => `<button class="rep c${i}" data-act="j-rep" data-i="${i}" ${q.type === 'multi' ? `aria-pressed="${this.sel.includes(i)}"` : ''}><span class="l">${LETTRES[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>
          ${q.type === 'multi' ? `<button class="btn rouge valider" data-act="j-valider" ${this.sel.length ? '' : 'disabled'}>Valider ma sélection</button>` : ''}`;
      } else if (vue === 'revel' || (vue === 'classement' && !st.competition)){
        const r = st.result || {};
        const bonne = (r.bonnes || []).map(i => esc(q.reponses[i])).join(', ');
        if (q.type === 'sondage') h = entete + `<div class="centre"><div class="retour neutre"><div class="gros-mot">Merci !</div><div class="info">${r.repondu ? 'Votre avis est enregistré, sans points.' : 'Vous n’avez pas répondu à ce sondage.'}</div></div></div>`;
        else if (!r.repondu) h = entete + `<div class="centre"><div class="retour ko"><div class="gros-mot">Pas de réponse</div><div class="info">Bonne réponse : ${bonne}</div></div><p class="petit">${esc(r.explication || '')}</p></div>`;
        else if (r.correct) h = entete + `<div class="centre"><div class="retour ok" id="retour-ok"><div class="gros-mot">Bonne réponse</div>${st.competition ? `<div class="pts num">+ ${fmt(r.points)}</div>` : ''}${st.streak >= 2 ? `<div class="info"><span class="flamme">Série de ${st.streak}${r.bonus ? ' · bonus +' + fmt(r.bonus) : ''}</span></div>` : ''}</div><p class="petit">${esc(r.explication || '')}</p></div>`;
        else h = entete + `<div class="centre"><div class="retour ko"><div class="gros-mot">Raté</div><div class="info">Bonne réponse : ${bonne}</div></div><p class="petit">${esc(r.explication || '')}</p></div>`;
      } else if (vue === 'classement'){
        h = entete + `<div class="centre"><div class="carte-rang"><div class="petit">Votre position</div><div class="r num">${st.rank}<sup>${st.rank === 1 ? 'er' : 'e'}</sup></div><div class="petit">sur ${st.players}</div>
          <p style="margin:10px 0 0">${st.ahead_nickname ? `À <b class="num">${fmt(st.ahead_gap)}</b> pts de <b>${esc(st.ahead_nickname)}</b>` : '<b>Vous menez la course !</b>'}</p></div></div>`;
      } else if (vue === 'podium'){
        h = entete + `<div class="centre">${st.competition ? `<div class="carte-rang"><div class="petit">Classement final</div><div class="r num">${st.rank}<sup>${st.rank === 1 ? 'er' : 'e'}</sup></div><div class="petit">sur ${st.players} · ${fmt(st.score)} pts</div></div>` : ''}
          <div class="carte-rang"><div class="petit">Bonnes réponses</div><div class="r num">${st.correct_count}<sup>/${st.scored_count}</sup></div></div><p class="petit">Merci pour votre participation !</p>
          ${this.integre ? '' : `<button class="lien" data-act="j-quitter">Rejoindre une autre session</button>`}</div>`;
      }
      if (st && st.paused) h += `<div class="pause-voile" style="font-size:44px">Pause</div>`;
    }
    if (this.horsLigne) h = `<div class="reseau" role="status">Connexion perdue · reconnexion…</div>` + h;
    el.innerHTML = h;
    const lf = $('.lien-formateur'); if (lf) lf.classList.toggle('hidden', this.etape === 'jeu');
    const ok = el.querySelector('#retour-ok'); if (ok && this.confettisQ !== this.st.q_index){ this.confettisQ = this.st.q_index; confettis(el.closest('.ecran') || el.closest('.solo'), 90); }
    if (this.etape === 'pin' && !this.integre){ const i = el.querySelector('#pin-in'); if (i && !this.pin) i.focus(); }
  }
}

/* ================= Interactions ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  const ed = () => F.edit, qe = () => F.edit.q.questions[F.edit.qi];
  switch (a){
    case 'depart': { son('depart'); const l = $('#lancement'); if (l) l.classList.add('sortie'); setTimeout(() => { F.ecran = 'formateur'; chargerBiblio(); rendre(); }, calme() ? 0 : 450); break; }
    case 'participant': { (async () => { F.ecran = 'formateur'; await chargerBiblio(); L.vueTel = 'tel'; const q = F.quizzes.find(x => x.theme === 'FMPA') || F.quizzes[0]; await ouvrirSession(q.id); })(); break; }
    case 'espace-formateur': e.preventDefault(); F.ecran = 'formateur'; history.replaceState(null, '', location.pathname + '#formateur'); initFormateur(); break;
    case 'nav': F.vue = b.dataset.vue; if (F.vue === 'biblio') chargerBiblio(); rendre(); window.scrollTo(0,0); break;
    case 'regl': reglages[b.dataset.k] = !reglages[b.dataset.k]; ecrire('ql85_reglages', reglages); rendre(); break;
    case 'deconnexion': api.signOut().then(() => { F.user = null; fermerLive(); rendre(); }); break;
    case 'filtre': F.filtre = b.dataset.t; rendre(); break;
    case 'lancer': modaleParametres(b.dataset.id); break;
    case 'lancer-edit': (async () => { await sauverQuiz(); if (F.edit.q.id) { if (F.edit.q.questions.some(incomplete)) toast('Attention : certaines questions sont à compléter.'); modaleParametres(F.edit.q.id); } })(); break;
    case 'sp': sessionReglages[b.dataset.k] = b.dataset.v === 'true'; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'ouvrir-salle': fermerModale(); ouvrirSession(b.dataset.id); break;
    case 'fermer': fermerModale(); break;
    case 'fermer-fond': if (e.target === b) fermerModale(); break;
    case 'modifier': ouvrirEditeur(F.quizzes.find(x => x.id === b.dataset.id)); break;
    case 'dupliquer': { const src = F.quizzes.find(x => x.id === b.dataset.id); const c = clone(src); delete c.id; c.titre = src.titre + ' (copie)';
      api.saveQuiz(c).then(() => chargerBiblio()).catch(err => toast(errMsg(err))); break; }
    case 'supprimer': { const q = F.quizzes.find(x => x.id === b.dataset.id);
      modale(`<div class="balisage"></div><div class="corps"><h3>Supprimer ce quiz ?</h3><p>« ${esc(q.titre)} » sera supprimé définitivement. Les résultats des sessions déjà jouées sont conservés.</p></div><div class="pied"><button class="btn fant" data-act="fermer" autofocus>Annuler</button><button class="btn rouge" data-act="supprimer-ok" data-id="${q.id}">Supprimer</button></div>`); break; }
    case 'supprimer-ok': fermerModale(); api.deleteQuiz(b.dataset.id).then(() => { if (F.edit && F.edit.q.id === b.dataset.id) F.edit = null; chargerBiblio(); }).catch(err => toast(errMsg(err))); break;
    case 'ajouter-exemples': ajouterExemples().then(chargerBiblio).catch(err => toast(errMsg(err))); break;
    case 'nouveau': ouvrirEditeur({titre:'Nouveau quiz', theme:'Autre', questions:[questionVide()]}); aSauver(); break;
    case 'choisir-q': if (e.target.closest('.ordre')) break; ed().qi = +b.dataset.i; rendre(); break;
    case 'monter': case 'descendre': { const arr = ed().q.questions, i = +b.dataset.i, j = a === 'monter' ? i - 1 : i + 1; if (j < 0 || j >= arr.length) break; [arr[i], arr[j]] = [arr[j], arr[i]]; ed().qi = j; rendre(); aSauver(); break; }
    case 'ajouter-q': ed().q.questions.push(questionVide()); ed().qi = ed().q.questions.length - 1; rendre(); aSauver(); { const t = $('#txt-q'); if (t) t.focus(); } break;
    case 'dupliquer-q': ed().q.questions.splice(ed().qi + 1, 0, clone(qe())); ed().qi++; rendre(); aSauver(); break;
    case 'supprimer-q': if (ed().q.questions.length > 1){ ed().q.questions.splice(ed().qi, 1); ed().qi = Math.max(0, ed().qi - 1); rendre(); aSauver(); } else toast('Un quiz garde au moins une question.'); break;
    case 'type-q': changerType(qe(), b.dataset.t); if (b.dataset.t === 'image' && !qe().imageData) qe().image = 'adr'; rendre(); aSauver(); break;
    case 'juste-q': { const x = qe(), i = +b.dataset.i; x.bonnes = x.type === 'multi' ? (x.bonnes.includes(i) ? x.bonnes.filter(k => k !== i) : [...x.bonnes, i].sort()) : [i]; rendre(); aSauver(); break; }
    // Session
    case 'vue-live': L.vueTel = b.dataset.v; rendre(); break;
    case 'h': { const act = b.dataset.a; b.disabled = true;
      if (act === 'start') son('clic');

    case 'exclure': modale(`<div class="balisage"></div><div class="corps"><h3>Exclure « ${esc(b.dataset.nom)} » ?</h3><p>Le participant quitte la salle. Il peut revenir avec un autre pseudo.</p></div><div class="pied"><button class="btn fant" data-act="fermer" autofocus>Annuler</button><button class="btn rouge" data-act="exclure-ok" data-id="${b.dataset.id}">Exclure</button></div>`); break;
    case 'exclure-ok': fermerModale(); actionHote('kick', {player_id:b.dataset.id}); break;
    case 'terminer': modale(`<div class="balisage"></div><div class="corps"><h3>Terminer la session ?</h3><p>Les questions restantes ne seront pas posées. Le podium et le bilan s’affichent tout de suite.</p></div><div class="pied"><button class="btn fant" data-act="fermer">Continuer la session</button><button class="btn rouge" data-act="terminer-ok" autofocus>Terminer</button></div>`); break;
    case 'terminer-ok': fermerModale(); actionHote('podium'); break;
    case 'plein-ecran': F.pleinEcran = !F.pleinEcran; try { if (F.pleinEcran && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); else if (!F.pleinEcran && document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch(err){} rendre(); break;
    case 'voir-res': F.pleinEcran = false; ouvrirResultats(b.dataset.id); break;
    case 'csv': { const csv = genererCSV(F.res), nom = `quizlive85_${F.res.pin}_${String(F.res.created_at).slice(0,10)}.csv`;
      modale(`<div class="balisage"></div><div class="corps"><h3>Export CSV</h3><p class="etiquette" style="margin:0 0 12px">Séparateur « ; », s’ouvre directement dans Excel.</p><textarea id="csv-txt" readonly aria-label="Contenu CSV">${esc(csv)}</textarea><p id="csv-msg" class="etiquette" role="status"></p></div>
        <div class="pied"><button class="btn fant" data-act="fermer">Fermer</button><button class="btn" data-act="copier-csv">Copier</button><button class="btn or" data-act="dl-csv" data-nom="${esc(nom)}" autofocus>Télécharger</button></div>`); break; }
    case 'dl-csv': { const ok = telecharger(b.dataset.nom, $('#csv-txt').value); $('#csv-msg').textContent = ok ? 'Téléchargement lancé. S’il ne démarre pas, utilisez « Copier ».' : 'Téléchargement bloqué : utilisez « Copier ».'; break; }
    case 'copier-csv': { const t = $('#csv-txt'), m = $('#csv-msg');
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => m.textContent = 'Copié : collez-le dans Excel.').catch(() => { t.select(); m.textContent = 'Copie bloquée : le texte est sélectionné, faites Ctrl+C.'; }); break; }
    // Participant
    case 'j-qr': J.pin = L.pin; J.validerPin(L.pin); break;
    case 'j-alea': J.pseudo = pick(PSEUDOS_ALEA); J.err = ''; J.rendre(); break;
    case 'j-rejoindre': J.rejoindre(J.anonyme ? '' : (($('#pseudo-in') || {}).value || '')); break;
    case 'j-rep': { const i = +b.dataset.i, q = J.st.question;
      if (q.type === 'multi'){ J.sel = J.sel.includes(i) ? J.sel.filter(k => k !== i) : [...J.sel, i]; son('clic'); J.rendre(); }
      else J.repondre([i]); break; }
    case 'j-valider': J.repondre([...J.sel].sort((x, y) => x - y)); break;
    case 'j-quitter': J.quitter(''); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'f-pin') J.validerPin($('#pin-in').value);
  if (e.target.id === 'f-pseudo') J.rejoindre($('#pseudo-in').value);
  if (e.target.id === 'form-connexion'){
    const err = $('#cx-err'); err.textContent = '';
    api.signIn($('#cx-mail').value.trim(), $('#cx-mdp').value).then(u => { F.user = u; F.vue = 'biblio'; rendre(); chargerBiblio(); })
      .catch(() => { err.textContent = 'Adresse ou mot de passe incorrect.'; });
  }
});
document.addEventListener('input', e => {
  const t = e.target, a = t.dataset.act; if (!a) return;
  if (a === 'recherche'){ F.recherche = t.value; const pos = t.selectionStart; rendre(); const n = $('#rech'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (!F.edit) return;
  const q = F.edit.q.questions[F.edit.qi];
  if (a === 'titre-quiz') F.edit.q.titre = t.value;
  if (a === 'champ-q'){ q[t.dataset.k] = t.dataset.num ? +t.value : t.value; if (t.tagName === 'SELECT') rendre(); else majListe(); }
  if (a === 'rep-q'){ q.reponses[+t.dataset.i] = t.value; majListe(); }
  aSauver();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.act; if (!a || !F.edit) return;
  const q = F.edit.q.questions[F.edit.qi];
  if (a === 'theme-quiz'){ F.edit.q.theme = t.value; aSauver(); }
  if (a === 'image-q' && t.files[0]) reduireImage(t.files[0]).then(d => { q.imageData = d; delete q.image; rendre(); aSauver(); }).catch(() => toast('Image illisible.'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modale-racine').innerHTML) fermerModale(); else if (F.pleinEcran){ F.pleinEcran = false; rendre(); } }
  if (e.key === 'Enter' && e.target.matches('.liste-q li')) e.target.click();
});
function majListe(){
  const li = $$('.liste-q li')[F.edit.qi]; if (!li) return;
  const x = F.edit.q.questions[F.edit.qi];
  li.querySelector('.t').textContent = x.texte || 'Sans intitulé';
  li.querySelector('.ty').innerHTML = `${TYPES[x.type]} · ${x.duree} s${x.type !== 'sondage' ? ' · ×' + x.coef : ''} ${incomplete(x) ? '<span class="alerte">· à compléter</span>' : ''}`;
}

/* ================= Boucle d'animation et démarrage ================= */
(function boucle(now){ tickHote(now); if (J) J.tick(now); requestAnimationFrame(boucle); })(performance.now());
async function initFormateur(){
  F.user = await api.user().catch(() => null);
  rendre();
  if (F.user) chargerBiblio();
}
window.addEventListener('hashchange', () => { if (MODE_REEL && location.hash === '#formateur' && F.ecran !== 'formateur'){ F.ecran = 'formateur'; initFormateur(); } });
if (F.ecran === 'formateur') initFormateur(); else rendre();

</script>
</body>
