<style>
/* Direction « Départ » : nuit marine, rouge 85, chrono-manomètre, bandes de balisage. Monde sombre unique (projection en salle). */
:root{
  --nuit:#0A1830; --marine:#132A4D; --marine-2:#1B3762; --marine-3:#24467A;
  --ligne:rgba(214,226,245,.14); --texte:#F4F6FA; --texte-2:#A9B6CB;
  --rouge:#D7192D; --rouge-vif:#F0293E; --or:#F5C542; --ok:#2FBF71; --ko:#E5484D;
  --a:#F2600C; --b:#0098AD; --c:#D99A00; --d:#2E9E5B; --c-texte:#1b1300;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fond:radial-gradient(1200px 600px at 85% -10%,rgba(215,25,45,.16),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(0,152,173,.10),transparent 60%);
  --proj-fond:radial-gradient(80% 70% at 50% 0%,#1d3c6c 0%,var(--nuit) 70%);
  --enonce-fond:rgba(255,255,255,.96); --enonce-texte:#0A1830;
  --surface:rgba(19,42,77,.55); --champ:var(--nuit);
  --rayon:10px; --ombre:0 30px 60px rgba(0,0,0,.35);
  --titre-style:italic; --titre-casse:uppercase;
  --g-face:#0b1426; --g-ring:#2b3d5c; --g-tick:#cfd8e6; --g-lab:#A9B6CB; --g-aiguille:#F0293E; --g-centre:#e8edf5; --g-sec:#fff;
  --bande:repeating-linear-gradient(-45deg,var(--rouge) 0 14px,#fff 14px 28px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--nuit);color:var(--texte);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;background-image:var(--fond);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.balisage{height:10px;background:var(--bande)}

/* Bandeaux d'information */
.bandeau-info{display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 16px;background:#1a1405;color:var(--or);font-size:13px;font-weight:600;border-bottom:1px solid rgba(245,197,66,.3);text-align:center}
.bandeau-info b{font-family:var(--display);letter-spacing:.08em;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--marine-3);border:1px solid var(--ligne);color:var(--texte);padding:10px 16px;border-radius:8px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;max-width:90vw;animation:fondu .2s}

/* En-tête formateur */
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--ligne);background:rgba(10,24,48,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.marque{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;font-style:italic;background:none;border:0;padding:0}
.marque .ecu{width:34px;height:34px}
.marque small{font-style:normal;color:var(--rouge-vif);font-size:1em}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1}
.nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--texte-2);font-weight:600;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--texte);background:var(--marine-2);box-shadow:inset 0 -2px 0 var(--rouge)}
.reglages{display:flex;gap:6px;align-items:center}
.bascule{display:flex;align-items:center;gap:6px;background:var(--marine);border:1px solid var(--ligne);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px;color:var(--texte-2)}
.bascule .pt{width:26px;height:16px;border-radius:999px;background:#3a4d6d;position:relative;transition:.2s;flex:none}
.bascule .pt::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.bascule[aria-pressed="true"]{color:var(--texte)}
.bascule[aria-pressed="true"] .pt{background:var(--ok)}
.bascule[aria-pressed="true"] .pt::after{left:12px}
.compte{font-size:13px;color:var(--texte-2);display:flex;gap:8px;align-items:center}
main{padding:28px 24px 60px;max-width:1360px;margin:0 auto}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ligne);background:var(--marine-2);padding:10px 16px;border-radius:8px;font-weight:600;transition:transform .12s,background .2s;text-decoration:none}
.btn:hover{background:var(--marine-3)}
.btn:active{transform:scale(.97)}
.btn.rouge{background:var(--rouge);border-color:transparent;color:#fff}
.btn.rouge:hover{background:var(--rouge-vif)}
.btn.or{background:var(--or);color:#1a1405;border-color:transparent}
.btn.fant{background:transparent}
.btn.gros{padding:14px 22px;font-size:18px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lien{background:none;border:0;color:var(--or);font-weight:600;text-decoration:underline;padding:4px}

/* Lancement (démo) */
.lancement{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:var(--nuit)}
.lancement::before{content:"";position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(60,120,255,.20) 330deg,transparent 360deg),conic-gradient(from 180deg,transparent 0 300deg,rgba(215,25,45,.22) 330deg,transparent 360deg);animation:gyro 3.2s linear infinite}
@keyframes gyro{to{transform:rotate(360deg)}}
.lancement .coeur{position:relative;text-align:center;padding:24px}
.lancement .sur{font-family:var(--display);letter-spacing:.4em;color:var(--texte-2);font-weight:600;font-size:15px}
.lancement h1{font-size:clamp(64px,15vw,190px);line-height:.85;font-weight:800;font-style:italic;letter-spacing:-.01em;margin:10px 0 0}
.lancement h1 span{display:block}
.lancement h1 .n85{color:var(--rouge);font-size:1.15em}
.lancement p{color:var(--texte-2);max-width:36ch;margin:18px auto 28px;font-size:18px}
.lancement .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lancement .bande{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(-45deg,var(--rouge) 0 22px,#fff 22px 44px);animation:defile 1.4s linear infinite;background-size:62.2px 22px}
@keyframes defile{to{background-position:62.2px 0}}
.mot{opacity:0;animation:monte .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes monte{from{opacity:0;transform:translateY(24px) skewX(-6deg)}to{opacity:1;transform:none}}
.lancement.sortie{animation:sortie .5s ease forwards}
@keyframes sortie{to{opacity:0;transform:scale(1.04)}}

/* Pages formateur */
.entete-page{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.entete-page h2{font-size:clamp(34px,5vw,52px);font-weight:800;text-transform:var(--titre-casse);font-style:var(--titre-style);line-height:.95}
.entete-page .sous{color:var(--texte-2);margin-top:6px}
.grille-accueil{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px}
@media (max-width:980px){.grille-accueil{grid-template-columns:1fr}}
.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.recherche{flex:1;min-width:200px;background:var(--champ);border:1px solid var(--ligne);border-radius:8px;padding:10px 12px}
.puce{border:1px solid var(--ligne);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--texte-2)}
.puce[aria-pressed="true"]{background:var(--texte);color:var(--nuit);border-color:var(--texte)}
.tableau-garde{border:1px solid var(--ligne);border-radius:var(--rayon);overflow:hidden;background:var(--surface)}
.tg-tete,.ligne-quiz{display:grid;grid-template-columns:8px 1fr 100px 70px 340px;gap:14px;padding:10px 16px 10px 0}
.tg-tete{font-family:var(--display);letter-spacing:.14em;font-size:12px;color:var(--texte-2);text-transform:uppercase;border-bottom:1px solid var(--ligne);background:rgba(0,0,0,.18)}
.ligne-quiz{align-items:center;padding:14px 16px 14px 0;border-bottom:1px solid var(--ligne)}
.ligne-quiz:last-child{border-bottom:0}
.ligne-quiz .tranche{align-self:stretch;margin:-14px 0}
.ligne-quiz h3{font-size:22px;font-weight:700;line-height:1.1}
.ligne-quiz .meta{color:var(--texte-2);font-size:14px}
.ligne-quiz .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ligne-quiz .actions .btn{padding:8px 12px;font-size:14px}
.theme{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase;padding:2px 8px;border-radius:4px}
@media (max-width:760px){
  .tg-tete{display:none}
  .ligne-quiz{grid-template-columns:6px 1fr;row-gap:8px}
  .ligne-quiz>.col{grid-column:2}
  .ligne-quiz .actions{justify-content:flex-start}
}
.panneau{border:1px solid var(--ligne);border-radius:var(--rayon);background:var(--surface);padding:18px}
.panneau+.panneau{margin-top:16px}
.panneau h3{font-size:20px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.etiquette{font-size:12px;color:var(--texte-2);letter-spacing:.06em}
.histo{list-style:none;margin:0;padding:0}
.histo li{border-top:1px solid var(--ligne)}
.histo li:first-child{border-top:0}
.histo button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;font-size:14px;width:100%;text-align:left;background:none;border:0}
.histo .taux{font-family:var(--display);font-size:20px;font-weight:700;grid-row:span 2;align-self:center}
.histo .d{color:var(--texte-2);font-size:13px}
.vide{border:1px dashed var(--ligne);border-radius:var(--rayon);padding:36px;text-align:center;color:var(--texte-2)}

/* Connexion formateur */
.connexion{max-width:420px;margin:8vh auto;padding:0 16px}
.connexion .panneau{padding:24px}
.connexion h2{font-size:40px;font-style:var(--titre-style);text-transform:var(--titre-casse);font-weight:800;margin-bottom:6px}
.erreur{color:#ff9aa0;font-size:14px;font-weight:600}

/* Éditeur */
.editeur{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}
@media (max-width:900px){.editeur{grid-template-columns:1fr}}
.champ{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.champ label,.champ .lab{font-size:13px;font-weight:600;color:var(--texte-2);letter-spacing:.04em}
.champ input,.champ select,.champ textarea{background:var(--champ);border:1px solid var(--ligne);border-radius:8px;padding:10px 12px;width:100%}
.champ textarea{min-height:76px;resize:vertical}
.liste-q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste-q li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--champ);border:1px solid var(--ligne);border-radius:8px;padding:8px 8px 8px 10px;cursor:pointer}
.liste-q li[aria-current="true"]{border-color:var(--rouge);box-shadow:inset 3px 0 0 var(--rouge)}
.liste-q .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--texte-2)}
.liste-q .t{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.liste-q .ty{font-size:11px;color:var(--texte-2);display:block;margin-top:2px}
.liste-q .ordre{display:flex;flex-direction:column}
.liste-q .ordre button{background:none;border:0;color:var(--texte-2);padding:0 4px;font-size:12px;line-height:1.2}
.alerte{color:var(--or);font-size:11px;font-weight:700}
.statut-sauv{font-size:13px;color:var(--texte-2);min-width:120px;text-align:right}
.rep-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.rep-edit{grid-template-columns:1fr}}
.rep-ligne{display:grid;grid-template-columns:38px 1fr 44px;align-items:center;border-radius:8px;overflow:hidden;border:1px solid var(--ligne);background:var(--champ)}
.rep-ligne .lettre{height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff}
.rep-ligne .lettre.c2{color:var(--c-texte)}
.rep-ligne input{border:0;background:transparent;padding:12px 10px;min-width:0}
.rep-ligne .juste{height:100%;border:0;border-left:1px solid var(--ligne);background:transparent;color:var(--texte-2);font-size:18px}
.rep-ligne .juste[aria-pressed="true"]{background:var(--ok);color:#06210f}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.trio{grid-template-columns:1fr}}
.segment{display:flex;background:var(--champ);border:1px solid var(--ligne);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.segment button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 6px;font-weight:600;color:var(--texte-2);font-size:14px;white-space:nowrap}
.segment button[aria-pressed="true"]{background:var(--marine-3);color:var(--texte)}
.apercu-img{max-width:260px;border-radius:8px;border:1px solid var(--ligne);display:block;margin-top:6px}

/* Modale */
.voile{position:fixed;inset:0;background:rgba(3,10,22,.72);display:grid;place-items:center;z-index:60;padding:16px;animation:fondu .2s}
@keyframes fondu{from{opacity:0}}
.modale{background:var(--marine);border:1px solid var(--ligne);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modale .balisage{border-radius:12px 12px 0 0}
.modale .corps{padding:22px}
.modale h3{font-size:28px;text-transform:var(--titre-casse);font-style:var(--titre-style);font-weight:800;margin-bottom:4px}
.modale .pied{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px;flex-wrap:wrap}
.modale textarea{width:100%;min-height:200px;background:var(--champ);border:1px solid var(--ligne);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* Session en direct */
.regie{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--marine);border:1px solid var(--ligne);border-radius:var(--rayon);padding:10px 12px;margin-bottom:16px}
.regie .etat{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.voyant{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:bip 1.6s infinite;flex:none}
.voyant.pause{background:var(--or);animation:none}
@keyframes bip{70%{box-shadow:0 0 0 10px rgba(47,191,113,0)}}
.regie .compteurs{color:var(--texte-2);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.regie .compteurs b{color:var(--texte)}
.regie .cmd{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.regie .cmd .btn{padding:8px 14px}
.onglets-live{display:none;margin-bottom:12px}
.scene{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;align-items:start}
.scene.sans-tel{grid-template-columns:minmax(0,1fr)}
@media (max-width:1060px){
  .scene{grid-template-columns:1fr}
  .onglets-live{display:flex}
  .scene[data-vue="proj"] .zone-tel{display:none}
  .scene[data-vue="tel"] .zone-proj{display:none}
}
.legende{font-family:var(--display);letter-spacing:.18em;font-size:12px;color:var(--texte-2);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.plein-ecran .top,.plein-ecran .bandeau-info,.plein-ecran .legende,.plein-ecran .onglets-live{display:none}
.plein-ecran main{max-width:none;padding:12px}
.plein-ecran .regie{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;opacity:.25;transition:opacity .2s;margin:0}
.plein-ecran .regie:hover,.plein-ecran .regie:focus-within{opacity:1}
.plein-ecran .proj{max-height:calc(100dvh - 24px);margin:0 auto}

/* Écran projeté (16:9, unités relatives) */
.proj{container-type:inline-size;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--ligne);background:var(--proj-fond);box-shadow:var(--ombre)}
.proj .cadre{position:absolute;inset:0;padding:3.2cqi 3.6cqi;display:flex;flex-direction:column}
.proj .bas{position:absolute;left:0;right:0;bottom:0;height:.9cqi;background:repeating-linear-gradient(-45deg,var(--rouge) 0 1.2cqi,#fff 1.2cqi 2.4cqi)}
.proj .bandeau{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:1.5cqi;color:var(--texte-2);text-transform:uppercase;gap:2cqi}
.proj .bandeau .q85{color:var(--texte);font-style:italic;letter-spacing:.04em;font-size:1.9cqi;white-space:nowrap}
.proj .bandeau .q85 span{color:var(--rouge-vif)}
.attente{display:grid;grid-template-columns:1fr auto;gap:3cqi;flex:1;align-items:center}
.attente .rejoindre{font-size:1.8cqi;color:var(--texte-2)}
.attente .rejoindre b{color:var(--texte)}
.attente .lib-pin{font-family:var(--display);letter-spacing:.3em;font-size:1.6cqi;color:var(--texte-2);margin-top:1.4cqi}
.attente .pin{font-family:var(--display);font-weight:800;font-size:11cqi;line-height:.9;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.attente .qr{background:#fff;padding:1.2cqi;border-radius:1cqi;width:19cqi;display:grid;place-items:center}
.attente .qr img,.attente .qr canvas{width:100%!important;height:auto!important;display:block}
.attente .qr .lg{font-size:1.1cqi;color:#0A1830;text-align:center;margin-top:.4cqi;font-weight:700}
.joueurs{display:flex;flex-wrap:wrap;gap:.8cqi;margin-top:2cqi;align-content:flex-start;min-height:12cqi;max-height:16cqi;overflow:hidden}
.jeton{background:var(--marine-2);border:1px solid var(--ligne);padding:.5cqi 1.2cqi;border-radius:.6cqi;font-weight:600;font-size:1.6cqi;color:var(--texte)}
button.jeton:hover{text-decoration:line-through;background:var(--ko)}
.jeton.neuf{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.compte-joueurs{font-family:var(--display);font-size:2cqi;font-weight:700;letter-spacing:.08em}
.compte-joueurs b{font-size:4cqi;color:var(--or)}
.intro{flex:1;display:grid;place-items:center;text-align:center;position:relative}
.intro .q{font-family:var(--display);font-weight:800;font-style:italic;font-size:10cqi;line-height:.9;text-transform:uppercase}
.intro .q span{color:var(--rouge-vif)}
.intro .ty{font-family:var(--display);letter-spacing:.3em;font-size:1.8cqi;color:var(--texte-2);margin-top:1cqi}
.intro .eclair{position:absolute;inset:-10% -30%;background:repeating-linear-gradient(-45deg,rgba(215,25,45,.9) 0 3cqi,rgba(255,255,255,.9) 3cqi 6cqi);animation:balaye .9s cubic-bezier(.7,0,.3,1) forwards;pointer-events:none}
@keyframes balaye{from{transform:translateX(-100%)}to{transform:translateX(110%)}}
.question{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:1.6cqi;min-height:0}
.enonce{font-family:var(--display);font-weight:700;font-size:3.6cqi;line-height:1.05;text-wrap:balance;background:var(--enonce-fond);color:var(--enonce-texte);padding:1.6cqi 2.2cqi;border-radius:1cqi;box-shadow:0 1cqi 0 rgba(0,0,0,.25);text-align:center}
.enonce small{display:block;font-size:.45em;font-family:var(--body);font-weight:600;opacity:.7;margin-top:.4em}
.question .milieu{display:grid;grid-template-columns:22cqi 1fr 22cqi;align-items:center;gap:2cqi;min-height:0}
.question .milieu>div{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.question .media{overflow:hidden}
.question .media img{max-height:100%;max-width:100%;border-radius:.8cqi;display:block;object-fit:contain}
.question .media svg{height:100%;width:auto;max-width:100%;display:block;border-radius:.8cqi}
.compteur-rep{text-align:center;font-family:var(--display);font-weight:700}
.compteur-rep b{display:block;font-size:7cqi;line-height:1}
.compteur-rep span{font-size:1.6cqi;letter-spacing:.2em;color:var(--texte-2)}
.mano{height:100%;width:auto;max-width:100%;display:block}
.mano .g-face{fill:var(--g-face);stroke:var(--g-ring)}
.mano .g-tick{stroke:var(--g-tick)}
.mano .g-lab{fill:var(--g-lab)}
.mano .g-ok{stroke:var(--ok)}.mano .g-warn{stroke:var(--or)}.mano .g-ko{stroke:var(--ko)}
.mano .aiguille path{fill:var(--g-aiguille)}
.mano .g-centre{fill:var(--g-centre)}
.mano .sec{font-family:var(--display);font-weight:800;fill:var(--g-sec)}
.mano.critique .aiguille{animation:tremble .12s infinite}
@keyframes tremble{50%{transform:translateX(.6px)}}
.mano.critique{animation:alarme .5s infinite alternate}
@keyframes alarme{to{filter:drop-shadow(0 0 1.4cqi rgba(240,41,62,.8))}}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqi}
.tuile{position:relative;overflow:hidden;display:flex;align-items:center;gap:1.4cqi;padding:1.3cqi 1.6cqi;border-radius:1cqi;font-weight:700;font-size:2.4cqi;color:#fff;line-height:1.1;opacity:0;animation:arrive .45s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes arrive{from{opacity:0;transform:translateY(1.5cqi) scale(.96)}to{opacity:1;transform:none}}
.tuile .l{font-family:var(--display);font-weight:800;font-size:3.2cqi;width:4.4cqi;height:4.4cqi;display:grid;place-items:center;background:rgba(0,0,0,.22);border-radius:.6cqi;flex:none}
.c0,.c1,.c2,.c3{position:relative;overflow:hidden}
.c0{background:var(--a)}.c1{background:var(--b)}.c2{background:var(--c);color:var(--c-texte)}.c3{background:var(--d)}
.c0::before,.c1::before,.c2::before,.c3::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16}
.c0::before{background:repeating-linear-gradient(45deg,#fff 0 4px,transparent 4px 14px)}
.c1::before{background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 14px)}
.c2::before{background:radial-gradient(#000 2px,transparent 2.5px) 0 0/12px 12px;opacity:.14}
.c3::before{background:repeating-linear-gradient(0deg,#fff 0 4px,transparent 4px 14px)}
.tuile>*,.rep>*{position:relative}
.revel{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:2.4cqi;min-height:0;margin-top:1.6cqi}
.enonce-revel{font-family:var(--display);font-weight:700;font-size:2.8cqi;line-height:1.1;margin-top:1.2cqi;text-wrap:balance}
.barres{display:flex;align-items:flex-end;gap:1.6cqi;height:100%;padding-bottom:7cqi;position:relative}
.barre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.barre .col{width:100%;border-radius:.8cqi .8cqi 0 0;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.barre .val{font-family:var(--display);font-weight:800;font-size:3cqi;margin-bottom:.4cqi}
.barre .pied{position:absolute;top:100%;padding-top:.6cqi;text-align:center;font-size:1.4cqi;line-height:1.15;color:var(--texte-2);width:100%}
.barre .pied b{display:block;font-family:var(--display);font-size:2.4cqi;color:var(--texte)}
.barre.juste .pied b::after{content:" ✓";color:var(--ok)}
.barre.faux .col{filter:saturate(.25) brightness(.6)}
.explic{background:rgba(255,255,255,.06);border:1px solid var(--ligne);border-left:.5cqi solid var(--ok);border-radius:.8cqi;padding:1.8cqi 2cqi;align-self:center}
.explic .titre{font-family:var(--display);letter-spacing:.2em;font-size:1.4cqi;color:var(--ok);font-weight:700}
.explic .bonne{font-family:var(--display);font-weight:700;font-size:3.2cqi;line-height:1.05;margin:.6cqi 0 1cqi}
.explic p{font-size:1.8cqi;margin:0;opacity:.9}
.explic .taux{margin-top:1.4cqi;font-size:1.6cqi;color:var(--texte-2)}
.explic .taux b{font-family:var(--display);font-size:3cqi;color:var(--texte)}
.classement{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1cqi;max-width:76cqi;width:100%;margin:0 auto}
.titre-proj{font-size:4.4cqi;font-style:var(--titre-style);font-weight:800;text-transform:var(--titre-casse);text-align:center}
.rang{display:grid;grid-template-columns:5cqi 1fr auto 6cqi;align-items:center;gap:1.4cqi;background:var(--marine-2);border-radius:.8cqi;padding:1cqi 1.6cqi;position:relative;overflow:hidden;opacity:0;animation:glisse .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms)}
@keyframes glisse{from{opacity:0;transform:translateX(-4cqi)}to{opacity:1;transform:none}}
.rang .remp{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(215,25,45,.35),rgba(215,25,45,.08));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .3s}
.rang>*{position:relative}
.rang .pos{font-family:var(--display);font-weight:800;font-size:3cqi}
.rang .nom{font-weight:700;font-size:2.2cqi}
.rang .sc{font-family:var(--display);font-weight:800;font-size:2.8cqi;font-variant-numeric:tabular-nums}
.rang .evo{font-size:1.5cqi;font-weight:700;text-align:right}
.evo.monte{color:var(--ok)}.evo.descend{color:var(--ko)}
.serie{color:var(--or);font-size:1.4cqi;font-weight:700;margin-left:.6cqi}
.podium{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:1.6cqi;padding:0 6cqi;margin-top:1cqi}
.marche{display:flex;flex-direction:column;align-items:center;text-align:center}
.marche .qui{font-weight:800;font-size:2.6cqi;opacity:0;animation:monte .6s forwards}
.marche .pts{font-family:var(--display);font-size:2.2cqi;color:var(--texte-2);opacity:0;animation:monte .6s forwards}
.marche .bloc{width:100%;margin-top:1cqi;border-radius:1cqi 1cqi 0 0;display:grid;place-items:start center;padding-top:1.4cqi;font-family:var(--display);font-weight:800;font-style:italic;font-size:8cqi;line-height:1;transform-origin:bottom;transform:scaleY(0);animation:pousse .9s cubic-bezier(.2,.9,.2,1) forwards;position:relative;overflow:hidden}
.marche .bloc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.4cqi;background:repeating-linear-gradient(-45deg,var(--rouge) 0 1cqi,#fff 1cqi 2cqi);opacity:.9}
@keyframes pousse{to{transform:scaleY(1)}}
.m1 .bloc{height:24cqi;background:linear-gradient(#ffd866,#c99a1f);color:#3b2a00}
.m2 .bloc{height:17cqi;background:linear-gradient(#e4ebf5,#9aa9bf);color:#1b2a40}
.m3 .bloc{height:12cqi;background:linear-gradient(#e5a173,#9a5a2f);color:#2d1406}
.stat-fin{display:flex;justify-content:center;gap:4cqi;margin-top:1cqi;font-size:1.5cqi;color:var(--texte-2);text-align:center}
.stat-fin b{display:block;font-family:var(--display);font-size:3.4cqi;color:var(--texte)}
.pause-voile{position:absolute;inset:0;background:rgba(10,24,48,.82);display:grid;place-items:center;z-index:5;font-family:var(--display);font-weight:800;font-style:italic;font-size:9cqi;letter-spacing:.05em;text-transform:uppercase;color:#fff;text-align:center}
.pause-voile span{display:block;font-size:2cqi;font-style:normal;font-weight:600;letter-spacing:.2em;color:#cfd8e6}
.confettis{position:absolute;inset:0;pointer-events:none;z-index:6}

/* Téléphone (démo) */
.zone-tel{display:flex;flex-direction:column;align-items:center}
.tel{height:min(700px,calc(100dvh - 190px));min-height:520px;max-width:100%;aspect-ratio:9/18.5;border-radius:42px;background:#04080f;padding:12px;box-shadow:0 0 0 2px #2b3a52,0 30px 60px rgba(0,0,0,.45);position:relative}
.tel .ecran{position:absolute;inset:12px;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#13294b,#0A1830);display:flex;flex-direction:column}
.tel .encoche{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#04080f;z-index:3}
.tel .barre-tel{height:46px;flex:none}

/* Écran participant (dans le téléphone de démo ou en plein écran sur un vrai téléphone) */
.ej{flex:1;display:flex;flex-direction:column;padding:10px 16px 18px;min-height:0;position:relative}
.solo{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#13294b,#0A1830);max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.solo .ej{padding:16px 18px 24px}
.ej .entete-tel{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--texte-2);margin-bottom:10px;gap:8px}
.ej .entete-tel b{color:var(--texte)}
.ej .centre{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.logo-tel{font-family:var(--display);font-weight:800;font-style:italic;font-size:40px;line-height:.9}
.logo-tel span{color:var(--rouge-vif)}
.ej input.pin-in{width:100%;text-align:center;font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.2em;background:#fff;color:#0A1830;border:0;border-radius:10px;padding:10px 4px}
.ej input.pseudo-in{width:100%;text-align:center;font-size:22px;font-weight:700;background:#fff;color:#0A1830;border:0;border-radius:10px;padding:12px}
.ej .btn{width:100%}
.ej .petit{font-size:12.5px;color:var(--texte-2)}
.ej .erreur{color:#ff9aa0;font-size:13px;font-weight:600}
.ej .reseau{position:absolute;top:0;left:0;right:0;background:var(--or);color:#1a1405;font-size:12px;font-weight:700;text-align:center;padding:3px;z-index:4}
.badge-pseudo{font-family:var(--display);font-weight:800;font-size:30px;background:var(--rouge);color:#fff;padding:6px 18px;border-radius:8px;font-style:italic;max-width:100%;overflow-wrap:anywhere}
.radar{width:120px;height:120px;border-radius:50%;position:relative;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(215,25,45,.7);animation:onde 2s infinite}
.radar::after{animation-delay:1s}
@keyframes onde{from{transform:scale(.35);opacity:1}to{transform:scale(1);opacity:0}}
.radar i{width:22px;height:22px;border-radius:50%;background:var(--rouge);box-shadow:0 0 20px var(--rouge)}
.q-tel{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;margin-bottom:10px;text-wrap:balance}
.chrono-tel{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px;flex:none}
.chrono-tel i{display:block;height:100%;background:var(--ok);transform-origin:left;transition:background .3s}
.grille-rep{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.grille-rep.deux{grid-template-columns:1fr}
.rep{position:relative;overflow:hidden;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;color:#fff;font-weight:700;font-size:15px;text-align:left;line-height:1.15;min-height:0;transition:transform .1s;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.rep.c2{color:var(--c-texte)}
.rep .l{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.rep:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.rep[aria-pressed="true"]{outline:4px solid #fff;outline-offset:-4px}
.rep[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-size:22px}
.valider{margin-top:10px}
.retour{width:100%;border-radius:16px;padding:22px 16px;text-align:center;color:#fff}
.retour.ok{background:linear-gradient(160deg,#2FBF71,#1c8a50)}
.retour.ko{background:linear-gradient(160deg,#E5484D,#a1262b)}
.retour.neutre{background:var(--marine-3)}
.retour .gros-mot{font-family:var(--display);font-weight:800;font-style:italic;font-size:42px;line-height:.95;text-transform:uppercase}
.retour .pts{font-family:var(--display);font-weight:800;font-size:30px;margin-top:6px}
.retour .info{font-size:14px;margin-top:6px;opacity:.92}
.flamme{display:inline-block;background:var(--or);color:#1a1405;font-weight:800;border-radius:999px;padding:3px 10px;font-size:13px}
.carte-rang{background:var(--marine-2);border-radius:16px;padding:18px;width:100%}
.carte-rang .r{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-style:italic}
.carte-rang .r sup{font-size:26px}
.reponse-envoyee{width:100%;border-radius:14px;padding:18px;display:flex;align-items:center;gap:12px;color:#fff;font-weight:700}
.reponse-envoyee.c2{color:var(--c-texte)}
.reponse-envoyee .l{font-family:var(--display);font-weight:800;font-size:34px}
.lien-formateur{text-align:center;font-size:12px;color:var(--texte-2);padding:10px}
.lien-formateur a{color:var(--texte-2)}

/* Résultats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--ligne);border-radius:var(--rayon);padding:14px 16px;background:var(--surface)}
.kpi b{display:block;font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.kpi span{color:var(--texte-2);font-size:13px}
.table-scroll{overflow-x:auto;border:1px solid var(--ligne);border-radius:var(--rayon);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ligne);vertical-align:middle}
th{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--texte-2);background:rgba(0,0,0,.18);white-space:nowrap}
tr:last-child td{border-bottom:0}
.jauge{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;min-width:120px}
.jauge i{display:block;height:100%;border-radius:5px}
.jauge+b{white-space:nowrap}
.alerte-q{display:inline-block;background:rgba(229,72,77,.18);color:#ff9aa0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:6px;letter-spacing:.04em}
h3.sec-titre{font-size:24px;text-transform:uppercase;margin:0 0 10px}

/* Petits écrans */
@media (max-width:720px){
  .bandeau-info{font-size:11.5px;padding:5px 12px}
  .top{padding:10px 16px;gap:10px}
  .top .nav{order:3;flex-basis:100%}
  .reglages{margin-left:auto}
  .bascule{font-size:0;gap:0;padding:5px}
  .compte span{display:none}
  main{padding:20px 16px 48px}
  .regie{padding:8px;gap:8px}
  .regie .cmd .btn{padding:7px 10px;font-size:14px}
  .regie .compteurs{font-size:13px;gap:10px}
  .tel{width:100%;aspect-ratio:auto;height:calc(100dvh - 130px);min-height:500px;padding:0;border-radius:24px;box-shadow:0 0 0 1px #2b3a52}
  .tel .ecran{inset:0;border-radius:24px}
  .tel .encoche{display:none}
  .tel .barre-tel{height:10px}
  .entete-page h2{font-size:34px}
}

/* Mouvement réduit */
body.calme *,body.calme *::before,body.calme *::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
body.calme .intro .eclair,body.calme .lancement::before{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .intro .eclair,.lancement::before{display:none}
}

/* =====================================================================
   CHARTE « LA LIGNE ROUGE » (module VSS · SDIS 85)
   encre #1E1B2E · papier #F7F3EA · corail #F2545B · soleil #FFB547 · menthe #14A38B · lilas #7B6CF6
   Traits d'encre épais, ombres franches décalées, typographie très grasse, fond papier pointillé.
   ===================================================================== */
:root{
  --ink:#1E1B2E; --paper:#F7F3EA; --muted:#6B6880;
  --coral:#F2545B; --coral-l:#FDE3E4; --sun:#FFB547; --sun-l:#FFF1D9; --mint:#14A38B; --mint-l:#DDF5EF; --lilac:#7B6CF6; --lilac-l:#ECE9FE;
  --trait:2.5px solid var(--ink); --sh:4px 4px 0 var(--ink); --sh-p:2px 2px 0 var(--ink);
  --nuit:var(--paper); --marine:#fff; --marine-2:#fff; --marine-3:var(--lilac-l);
  --ligne:var(--ink); --texte:var(--ink); --texte-2:var(--muted);
  --rouge:var(--coral); --rouge-vif:var(--coral); --or:var(--sun); --ok:var(--mint); --ko:var(--coral);
  --a:var(--coral); --b:var(--lilac); --c:var(--sun); --d:var(--mint); --c-texte:var(--ink);
  --display:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --body:var(--display);
  --fond:radial-gradient(rgba(30,27,46,.08) 1px,transparent 1px);
  --proj-fond:radial-gradient(rgba(30,27,46,.07) 1px,transparent 1px) 0 0/16px 16px,var(--paper);
  --enonce-fond:#fff; --enonce-texte:var(--ink);
  --surface:#fff; --champ:#fff; --rayon:14px; --ombre:var(--sh);
  --titre-style:normal; --titre-casse:none;
  --g-face:#fff; --g-ring:var(--ink); --g-tick:var(--ink); --g-lab:var(--muted); --g-aiguille:var(--coral); --g-centre:var(--ink); --g-sec:var(--ink);
  --bande:var(--coral);
  --confettis:#F2545B,#FFB547,#14A38B,#7B6CF6,#1E1B2E;
  color-scheme:light;
}
body{background-color:var(--paper);background-size:18px 18px}
h1,h2,h3,.entete-page h2,.modale h3,.connexion h2,.titre-proj{font-weight:900;letter-spacing:-.02em}
.entete-page h2{background:linear-gradient(transparent 60%,var(--sun) 60%,var(--sun) 92%,transparent 92%);display:inline;line-height:1.15}
:focus-visible{outline-color:var(--lilac)}

/* En-tête : bandeau encre, comme le module */
.top{background:var(--ink);color:#fff;border-bottom:0}
.marque,.top .marque{color:#fff;font-style:normal;font-weight:900;letter-spacing:.02em}
.marque small{color:var(--coral)}
.nav button{color:rgba(255,255,255,.72);font-weight:800}
.nav button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 -3px 0 var(--coral)}
.bascule{background:transparent;border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.8)}
.bascule[aria-pressed="true"]{color:#fff}
.bascule .pt{background:#d5d1c6;border:2px solid #fff;height:18px;width:30px}
.bascule .pt::after{top:1px;left:1px}
.bascule[aria-pressed="true"] .pt{background:var(--coral)}
.compte{color:rgba(255,255,255,.8)}
.compte .btn{color:#fff;border-color:#fff;box-shadow:none;background:transparent}
.bandeau-info{background:var(--sun);color:var(--ink);border-bottom:var(--trait)}
.bandeau-info b{background:var(--ink);color:#fff;padding:1px 8px;border-radius:5px;transform:rotate(-1.5deg);display:inline-block;font-size:12px}
.marque .ecu path:first-child{fill:var(--coral)}

/* Boutons « tampon » */
.btn{background:#fff;border:var(--trait);border-radius:12px;box-shadow:3px 3px 0 var(--ink);font-weight:800;color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--sun-l)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.rouge{background:var(--coral);color:#fff}
.btn.rouge:hover{background:#e8444b}
.btn.or{background:var(--sun);color:var(--ink)}
.btn.fant{background:#fff}
.btn.gros{font-family:var(--display);font-weight:900;letter-spacing:.02em;text-transform:none}
.lien{color:var(--lilac)}

/* Surfaces */
.panneau,.tableau-garde,.kpi,.table-scroll,.regie,.modale,.connexion .panneau{background:#fff;border:var(--trait);box-shadow:var(--sh)}
.tg-tete,th{background:var(--paper);color:var(--ink)}
.ligne-quiz,.tg-tete,th,td,.histo li{border-color:rgba(30,27,46,.18)}
.ligne-quiz h3{font-weight:900}
.theme{border:2px solid currentColor;font-family:var(--display);font-weight:900;letter-spacing:.06em}
.puce{border:2px solid var(--ink);color:var(--ink);font-weight:800;background:#fff}
.puce[aria-pressed="true"]{background:var(--ink);color:#fff}
.recherche,.champ input,.champ select,.champ textarea,.modale textarea{border:2px solid var(--ink);background:#fff}
.liste-q li{border:2px solid var(--ink);background:var(--paper)}
.liste-q li[aria-current="true"]{background:#fff;border-color:var(--coral);box-shadow:inset 5px 0 0 var(--coral),var(--sh-p)}
.rep-ligne{border:2px solid var(--ink)}
.rep-ligne .lettre{color:#fff}
.rep-ligne .lettre.c2{color:var(--ink)}
.rep-ligne .juste{border-left:2px solid var(--ink)}
.rep-ligne .juste[aria-pressed="true"]{background:var(--mint);color:#fff}
.segment{border:2px solid var(--ink);background:#fff}
.segment button[aria-pressed="true"]{background:var(--ink);color:#fff}
.alerte{color:#b5651d}
.alerte-q{background:var(--coral-l);color:#b3262c;border:1.5px solid var(--coral)}
.jauge{background:var(--paper);border:1.5px solid var(--ink);height:12px}
.voile{background:rgba(30,27,46,.55)}
.modale{background:var(--paper)}
.modale .balisage,.balisage{height:8px}
.toast{background:var(--ink);color:#fff;border:0}
.vide{border:2.5px dashed var(--ink);background:rgba(255,255,255,.6);color:var(--muted)}
.regie .etat{font-family:var(--display);font-weight:900;letter-spacing:.06em}
.voyant{background:var(--mint)}
.legende{font-weight:900;letter-spacing:.1em;color:var(--muted)}

/* Écran de lancement */
.lancement{background:var(--paper);background-image:radial-gradient(rgba(30,27,46,.09) 1px,transparent 1px);background-size:18px 18px}
.lancement::before{display:none}
.lancement .sur{display:inline-block;background:var(--ink);color:#fff;padding:3px 12px;border-radius:6px;letter-spacing:.14em;font-weight:900;font-size:13px;transform:rotate(-1.5deg)}
.lancement h1{font-style:normal;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
.lancement h1 .n85{color:#fff;background:var(--coral);display:inline-block;padding:0 .12em;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg);margin-top:.08em;font-size:1em}
.lancement p{color:var(--muted);font-weight:600}
.lancement .bande{height:14px;background:var(--coral);animation:none;border-top:var(--trait)}

/* Écran projeté */
.proj{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:18px}
.proj .bas{height:1cqi;background:var(--coral);border-top:.25cqi solid var(--ink)}
.proj .bandeau{color:var(--muted);font-weight:900}
.proj .bandeau .q85{font-style:normal;font-weight:900;color:var(--ink)}
.proj .bandeau .q85 span{background:var(--coral);color:#fff;padding:0 .3em;border-radius:.3em}
.attente .pin{font-weight:900;letter-spacing:.04em;background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 90%,transparent 90%);display:inline}
.attente .lib-pin{font-weight:900}
.attente .qr{border:.3cqi solid var(--ink);box-shadow:.5cqi .5cqi 0 var(--ink)}
.compte-joueurs{font-weight:900}
.compte-joueurs b{color:var(--coral)}
.jeton{background:#fff;border:.2cqi solid var(--ink);box-shadow:.25cqi .25cqi 0 var(--ink);font-weight:800}
button.jeton:hover{background:var(--coral);color:#fff}
.intro .q{font-style:normal;font-weight:900;letter-spacing:-.02em}
.intro .q span{color:#fff;background:var(--coral);padding:0 .1em;border-radius:.12em;border:.4cqi solid var(--ink)}
.intro .ty{font-weight:900;color:var(--muted)}
.intro .eclair{background:var(--sun);inset:0;border-left:.5cqi solid var(--ink);border-right:.5cqi solid var(--ink)}
.enonce{font-weight:900;border:.3cqi solid var(--ink);box-shadow:.6cqi .6cqi 0 var(--ink);border-radius:1.2cqi}
.enonce-revel{font-weight:900}
.compteur-rep b{color:var(--ink);font-weight:900}
.compteur-rep span{font-weight:900}
.mano .sec{font-weight:900}
.mano.critique{animation:alarme-lr .5s infinite alternate}
@keyframes alarme-lr{to{filter:drop-shadow(0 0 1.2cqi rgba(242,84,91,.9))}}
.tuile{border:.3cqi solid var(--ink);box-shadow:.4cqi .4cqi 0 var(--ink);font-weight:800}
.tuile .l{background:#fff;color:var(--ink);border:.2cqi solid var(--ink);font-weight:900}
.barre .col{border:.25cqi solid var(--ink);border-bottom:0}
.barre .val,.barre .pied b{font-weight:900;color:var(--ink)}
.barre.juste .pied b::after{color:var(--mint)}
.barre.faux .col{filter:saturate(.15) brightness(1.05);opacity:.45}
.explic{background:var(--mint-l);border:.25cqi solid var(--ink);border-left:1cqi solid var(--mint);box-shadow:.5cqi .5cqi 0 var(--ink)}
.explic .titre{color:var(--mint);font-weight:900}
.explic .bonne{font-weight:900}
.explic .taux b{font-weight:900}
.rang{background:#fff;border:.25cqi solid var(--ink);box-shadow:.35cqi .35cqi 0 var(--ink)}
.rang .remp{background:linear-gradient(90deg,var(--sun-l),var(--sun))}
.rang .pos,.rang .sc{font-weight:900}
.serie{color:#b5651d}
.marche .bloc{border:.35cqi solid var(--ink);border-bottom:0;font-style:normal;font-weight:900;box-shadow:.6cqi .6cqi 0 var(--ink)}
.marche .bloc::after{background:var(--coral);height:1cqi;opacity:1}
.m1 .bloc{background:var(--sun);color:var(--ink)}
.m2 .bloc{background:var(--lilac);color:#fff}
.m3 .bloc{background:var(--mint);color:#fff}
.marche .qui{font-weight:900}
.stat-fin b{font-weight:900}
.pause-voile{background:rgba(30,27,46,.86);font-style:normal;font-weight:900}

/* Téléphone et écran participant */
.tel{background:var(--ink);box-shadow:6px 6px 0 rgba(30,27,46,.35)}
.tel .ecran,.solo{background:var(--paper);background-image:radial-gradient(rgba(30,27,46,.08) 1px,transparent 1px);background-size:16px 16px}
.tel .encoche{background:var(--ink)}
.logo-tel{font-style:normal;font-weight:900;letter-spacing:-.02em}
.logo-tel span{color:#fff;background:var(--coral);padding:0 .15em;border-radius:.15em;border:3px solid var(--ink)}
.ej input.pin-in,.ej input.pseudo-in{border:var(--trait);box-shadow:var(--sh);font-weight:900}
.ej .erreur,.erreur{color:#c0272e}
.ej .reseau{background:var(--sun);border-bottom:2px solid var(--ink)}
.badge-pseudo{background:var(--coral);border:var(--trait);box-shadow:var(--sh);font-style:normal;font-weight:900;transform:rotate(-2deg)}
.radar::before,.radar::after{border-color:var(--coral)}
.radar i{background:var(--coral);border:3px solid var(--ink);box-shadow:none}
.q-tel{font-weight:900}
.chrono-tel{background:#fff;border:2px solid var(--ink);height:12px;border-radius:7px}
.rep{border:var(--trait);box-shadow:4px 4px 0 var(--ink);color:#fff;font-weight:800}
.rep .l{font-weight:900}
.rep:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.rep[aria-pressed="true"]{outline:4px dashed var(--ink);outline-offset:3px}
.retour{border:var(--trait);box-shadow:var(--sh)}
.retour.ok{background:var(--mint)}
.retour.ko{background:var(--coral)}
.retour.neutre{background:var(--lilac)}
.retour .gros-mot{font-style:normal;font-weight:900;text-transform:none;letter-spacing:-.02em}
.flamme{background:var(--sun);color:var(--ink);border:2px solid var(--ink)}
.carte-rang{background:#fff;border:var(--trait);box-shadow:var(--sh)}
.carte-rang .r{font-style:normal;font-weight:900}
.reponse-envoyee{border:var(--trait);box-shadow:var(--sh);font-weight:800}
.lien-formateur a{color:var(--muted)}

@media (max-width:720px){
  .tel{box-shadow:none;border:var(--trait)}
}

/* =====================================================================
   CHARTE GRAPHIQUE DU SDIS DE LA VENDÉE (sept. 2023) appliquée au format « La ligne rouge »
   Bleu #0B193B · Rouge #E52A21 · Dégradé rouge #E52A21 → violet #744E9A → bleu #1A3B87
   Couleurs par nature opérationnelle (réponses A-D) : incendie #E52A21 · organisation #744E9A ·
   opérations diverses #F8BD43 · secours routier #269659
   Polices : Mont (installée sur les postes du SDIS), repli Montserrat ; Pacifico pour les titres
   (avec parcimonie, jamais en capitales, jamais en texte courant). Fond clair.
   ===================================================================== */
:root{
  --ink:#0B193B; --paper:#F4F6FA; --muted:#4A5470;
  --coral:#E52A21; --coral-l:#FCE4E2; --sun:#F8BD43; --sun-l:#FEF3DC; --mint:#269659; --mint-l:#E2F3E9; --lilac:#744E9A; --lilac-l:#EFE9F6;
  --bleu-2:#1A3B87;
  --degrade:linear-gradient(90deg,#E52A21 0%,#744E9A 55%,#1A3B87 100%);
  --display:'Mont','Montserrat','Century Gothic',system-ui,sans-serif;
  --body:'Mont','Montserrat','Century Gothic',system-ui,sans-serif;
  --script:'Pacifico',cursive;
  --fond:radial-gradient(rgba(11,25,59,.07) 1px,transparent 1px);
  --proj-fond:radial-gradient(rgba(11,25,59,.06) 1px,transparent 1px) 0 0/16px 16px,#fff;
  --g-aiguille:#E52A21; --g-centre:#0B193B;
  --confettis:#E52A21,#744E9A,#1A3B87,#F8BD43,#ffffff;
}
body{background-color:var(--paper)}

/* Titres : Mont en capitales, très gras, bleu ; filet rouge à la place du surlignage */
.entete-page h2{background:none;display:inline-block;text-transform:uppercase;font-weight:900;letter-spacing:.01em;line-height:1.05;padding-bottom:.12em;border-bottom:.14em solid var(--coral)}
.modale h3,.connexion h2,.panneau h3,h3.sec-titre{text-transform:uppercase;font-weight:900;letter-spacing:.01em}
.script{font-family:var(--script)!important;font-weight:400!important;text-transform:none!important;letter-spacing:0!important;font-style:normal!important;
  background:var(--degrade);-webkit-background-clip:text;background-clip:text;color:transparent!important;padding:0 .08em .12em}

/* En-tête : aplat bleu et filet rouge, logo du SDIS */
.top{background:var(--ink);box-shadow:inset 0 -4px 0 var(--coral);padding-bottom:16px}
.marque{font-family:var(--display);font-weight:900;letter-spacing:.04em}
.marque small{color:var(--coral);background:#fff;border-radius:4px;padding:0 4px}
.logo-img{height:40px;width:auto;display:block}
.connexion .marque{color:var(--ink)}
.connexion .marque small{color:#fff;background:var(--coral)}
.bandeau-info{background:var(--coral);color:#fff;border-bottom:var(--trait)}
.bandeau-info b{background:#fff;color:var(--coral)}

/* Étiquettes : bandeau rouge, texte blanc en capitales (comme les intertitres de la charte) */
.legende{color:var(--ink)}
.legende span:first-child{background:var(--coral);color:#fff;padding:2px 8px;letter-spacing:.08em}
.etiquette{color:var(--muted)}
.theme{border-width:2px}

/* Boutons */
.btn.rouge{background:var(--coral)}
.btn.rouge:hover{background:#c9221a}
.btn:hover{background:#EEF1F8}
.btn.or{background:var(--sun);color:var(--ink)}
.lien{color:var(--bleu-2)}
.segment button[aria-pressed="true"],.puce[aria-pressed="true"]{background:var(--ink)}
.liste-q li[aria-current="true"]{border-color:var(--coral);box-shadow:inset 5px 0 0 var(--coral),var(--sh-p)}

/* Écran de lancement : couverture de la charte (logo, bandeau, titre Pacifico dégradé, filigrane rouge) */
.lancement.charte{background:#fff;background-image:radial-gradient(rgba(11,25,59,.07) 1px,transparent 1px);background-size:18px 18px}
.lancement.charte .coeur{padding-bottom:12vh}
.logo-lancement{height:clamp(90px,14vh,140px);width:auto;display:block;margin:0 auto 14px}
.lancement.charte .sur{background:var(--coral);color:#fff;transform:none;border-radius:0;font-size:clamp(10px,1.4vw,14px);letter-spacing:.06em;font-weight:700;padding:5px 14px}
.lancement.charte h1{margin:.08em 0 0;line-height:1.25}
.lancement.charte h1 .script{font-size:clamp(70px,13vw,170px);display:inline-block}
.lancement.charte .sous-titre{color:var(--ink);font-weight:600;letter-spacing:.04em;font-size:clamp(16px,2.2vw,24px);margin:6px auto 26px;max-width:none;line-height:1.25}
.lancement.charte .sous-titre b{font-weight:900}
.lancement.charte .bande{height:10px;background:var(--coral);border-top:0}
.filigrane{-webkit-mask:var(--filigrane) bottom center/contain no-repeat;mask:var(--filigrane) bottom center/contain no-repeat;background:var(--coral);pointer-events:none}
.lancement .filigrane{position:absolute;left:0;right:0;bottom:10px;height:min(16vw,150px)}
.proj .filigrane{position:absolute;left:0;right:0;bottom:.9cqi;height:7cqi;opacity:.9}
.proj .attente+.joueurs{margin-bottom:6cqi}

/* Écran projeté */
.proj .bandeau .q85{display:flex;align-items:center;gap:.8cqi;font-weight:900}
.proj .bandeau .q85 span{background:var(--coral)}
.logo-proj{height:3.2cqi;width:auto}
.attente .pin{background:none;color:var(--ink);border-bottom:.6cqi solid var(--coral);line-height:1;display:inline-block;padding-bottom:.4cqi;margin-bottom:1.2cqi}
.compte-joueurs b{color:var(--coral)}
.intro .eclair{background:var(--degrade);border:0}
.intro .q span{background:var(--coral)}
.titre-proj{text-transform:uppercase}
.titre-proj.script{font-size:4.6cqi;line-height:1.15;margin-top:0!important}
.rang .remp{background:linear-gradient(90deg,var(--lilac-l),#D8CBE8)}
.m1 .bloc{background:var(--sun);color:var(--ink)}
.m2 .bloc{background:var(--bleu-2);color:#fff}
.m3 .bloc{background:var(--lilac);color:#fff}
.marche .bloc::after{background:var(--coral)}

/* Téléphone */
.tel .ecran,.solo{background-color:var(--paper)}
.logo-tel-img{height:84px;width:auto}
.logo-tel{text-transform:uppercase}
.badge-pseudo{background:var(--ink)}
.retour.neutre{background:var(--bleu-2)}

/* ================= Utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PSEUDOS_ALEA = ['Lance-Canon','Fourgon Express','Échelle Rouge','Grande Lance','Division 85','Tuyau Agile','Gyrophare','Bip Bip FPT','Vigie Côtière','Hydrant Malin','Pompe Turbo','Cordage Fou'];
const MSG = {
  pin:'Ce code ne correspond à aucune session ouverte. Vérifiez le PIN affiché à l’écran.',
  complet:'La session est complète.', pseudo_longueur:'Choisissez un pseudo de 1 à 16 caractères.',
  pseudo_interdit:'Ce pseudo n’est pas accepté. Choisissez-en un autre.', pseudo_pris:'Ce pseudo est déjà pris dans la salle.',
  fermee:'La question est fermée.', pause:'Le quiz est en pause.', pas_commencee:'Attendez le début du chrono.',

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => Math.round(n || 0).toLocaleString('fr-FR');
const clone = o => JSON.parse(JSON.stringify(o));
const memeEnsemble = (a, b) => a.length === b.length && [...a].sort((x,y)=>x-y).join() === [...b].sort((x,y)=>x-y).join();

/* ================= Sons, vibrations, confettis ================= */
let audioCtx = null;
function son(type){
  if (!reglages.sons) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = {tic:[[880,.05]], ok:[[660,.09],[880,.09],[1320,.18]], ko:[[330,.14],[247,.22]], depart:[[435,.28],[580,.28],[435,.28],[580,.28]], clic:[[520,.04]], fin:[[523,.12],[659,.12],[784,.12],[1047,.35]]}[type] || [];
    let t = audioCtx.currentTime;
    notes.forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type === 'depart' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(type === 'depart' ? .05 : .12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + d + .02); t += d;
    });
  }catch(e){}
}
function vibre(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function confettis(hote, quantite = 140){
  if (calme() || !hote) return;
  const c = document.createElement('canvas'); c.className = 'confettis'; hote.appendChild(c);
  const r = hote.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const couleurs = getComputedStyle(document.body).getPropertyValue('--confettis').split(',').map(s => s.trim()).filter(Boolean);
  const pal = couleurs.length ? couleurs : ['#D7192D','#ffffff','#F5C542','#F0293E','#ffe9a8'];
  const parts = Array.from({length:quantite}, () => ({x:r.width/2 + rnd(-r.width*.2, r.width*.2), y:r.height*.35, vx:rnd(-6,6), vy:rnd(-11,-3), w:rnd(5,10), h:rnd(8,14), a:rnd(0,6), va:rnd(-.2,.2), c:pick(pal)}));
  const debut = performance.now();
  (function anime(t){
    x.clearRect(0,0,r.width,r.height);
    parts.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if (t - debut < 3200) requestAnimationFrame(anime); else c.remove();
  })(debut);
}
function compteur(el, de, a, ms = 900){
  if (!el) return;
  if (calme()) { el.textContent = fmt(a); return; }
  const t0 = performance.now();
  (function f(t){ const k = Math.min(1,(t-t0)/ms), e = 1 - Math.pow(1-k,3); el.textContent = fmt(de + (a-de)*e); if (k < 1) requestAnimationFrame(f); })(t0);
}

/* ================= Chronomètre « manomètre » ================= */
function manometre(){
  const cx = 100, cy = 98, r = 78;
  const ang = v => (150 + 240 * v) * Math.PI / 180;
  const pt = (v, rr) => [cx + rr * Math.cos(ang(v)), cy + rr * Math.sin(ang(v))];
  const arc = (v0, v1, rr) => { const [x0,y0] = pt(v0,rr), [x1,y1] = pt(v1,rr); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${rr} ${rr} 0 ${(v1-v0)*240 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  let grad = '';
  for (let i = 0; i <= 30; i++){ const v = i/30, long = i % 10 === 0, [x0,y0] = pt(v, r - 4), [x1,y1] = pt(v, r - (long ? 16 : 9)); grad += `<line class="g-tick" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${long ? 2.4 : 1.2}"/>`; }
  const lab = [0,100,200,300].map((n,i) => { const [x,y] = pt(i/3, r - 28); return `<text class="g-lab" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="10">${n}</text>`; }).join('');
  return `<svg class="mano" viewBox="0 0 200 190" role="img" aria-label="Temps restant">
    <circle class="g-face" cx="${cx}" cy="${cy}" r="${r+10}" stroke-width="3"/>
    <path class="g-ko" d="${arc(0,.17,r)}" stroke-width="7" fill="none"/><path class="g-warn" d="${arc(.17,.34,r)}" stroke-width="7" fill="none"/><path class="g-ok" d="${arc(.34,1,r)}" stroke-width="7" fill="none"/>
    ${grad}${lab}
    <text class="g-lab" x="${cx}" y="${cy-22}" text-anchor="middle" font-size="9" letter-spacing="2">BAR · TEMPS</text>
    <g class="aiguille" transform="rotate(30 ${cx} ${cy})"><path d="M${cx-8} ${cy}L${cx+r-14} ${cy-1.6}L${cx+r-14} ${cy+1.6}Z"/></g>
    <circle class="g-centre" cx="${cx}" cy="${cy}" r="8"/><circle cx="${cx}" cy="${cy}" r="3" fill="#0A1830"/>
    <text class="sec" x="${cx}" y="${cy+48}" text-anchor="middle" font-size="34">0</text></svg>`;
}
function majManometre(svg, rest, total, pause){
  if (!svg) return;
  const v = Math.max(0, Math.min(1, rest / total));
  svg.querySelector('.aiguille').setAttribute('transform', `rotate(${(150 + 240 * v).toFixed(2)} 100 98)`);
  const s = String(Math.max(0, Math.ceil(rest / 1000)));
  const t = svg.querySelector('.sec'); if (t.textContent !== s) t.textContent = s;
  svg.classList.toggle('critique', rest <= 5000 && rest > 0 && !pause);
}

/* ================= Logique de jeu partagée (identique au serveur) ================= */
function pointsReponse(q, ecouleMs, dureeMs, serie){
  const bonus = Math.min(100 * serie, 500);
  return {bonus, points: Math.round(1000 * (q.coef || 1) * (1 - ecouleMs / (2 * dureeMs))) + bonus};
}
function genererCSV(res){
  const qc = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lignes = [];
  lignes.push(['Question','Intitulé','Type','Compétence','Réponses reçues','Bonnes réponses','Taux de réussite (%)','Temps moyen (s)'].map(qc).join(';'));
  res.history.forEach(h => { const q = res.questions[h.q_index];
    lignes.push([h.q_index + 1, q.texte, TYPES[q.type] || q.type, q.competence, h.repondants, h.note ? h.correct : '', h.note ? Math.round(h.correct / Math.max(1, res.players_count) * 100) : '', (h.avg_ms / 1000).toFixed(1)].map(qc).join(';')); });
  if (res.players.length){
    lignes.push('');
    lignes.push(['Rang','Pseudo','Score','Bonnes réponses', ...res.history.flatMap(h => [`Q${h.q_index+1} réponse`, `Q${h.q_index+1} points`])].map(qc).join(';'));
    res.players.forEach((p, i) => lignes.push([i + 1, p.nickname, p.score, Object.values(p.answers).filter(a => a.correct).length,
      ...res.history.flatMap(h => { const a = p.answers[String(h.q_index)]; return [a ? a.choice.map(c => LETTRES[c]).join('+') : '', a ? a.points : 0]; })].map(qc).join(';')));
  }
  return lignes.join('\r\n');
}

/* ================= Backend 1 : Supabase (mode réel) ================= */
class SupaApi {
  constructor(){
    this.demo = false;
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    this.canaux = {}; this.etats = {};
  }
  async rpc(fn, args){ const {data, error} = await this.sb.rpc(fn, args || {}); if (error) throw new Error(error.message); return data; }
  async user(){ const {data} = await this.sb.auth.getSession(); return data && data.session ? data.session.user : null; }
  async signIn(email, mdp){ const {data, error} = await this.sb.auth.signInWithPassword({email, password:mdp}); if (error) throw error; return data.user; }
  async signOut(){ await this.sb.auth.signOut(); }
  listQuizzes(){ return this.rpc('list_quizzes'); }
  saveQuiz(q){ return this.rpc('save_quiz', {p_id:q.id || null, p_titre:q.titre, p_theme:q.theme, p_questions:q.questions}); }
  deleteQuiz(id){ return this.rpc('delete_quiz', {p_id:id}); }
  createSession(quizId, settings){ return this.rpc('create_session', {p_quiz:quizId, p_settings:settings}); }
  hostState(sid, full){ return this.rpc('host_state', {p_session:sid, p_full:!!full}); }
  hostAction(sid, action, arg){ return this.rpc('host_action', {p_session:sid, p_action:action, p_arg:arg || null}); }
  listSessions(){ return this.rpc('list_sessions'); }
  sessionResults(sid){ return this.rpc('session_results', {p_session:sid}); }
  checkPin(pin){ return this.rpc('check_pin', {p_pin:pin}); }
  joinSession(pin, nick){ return this.rpc('join_session', {p_pin:pin, p_nickname:nick}); }
  playerState(c){ return this.rpc('player_state', {p_session:c.sid, p_player:c.pid, p_token:c.token}); }
  submitAnswer(c, q, choix){ return this.rpc('submit_answer', {p_session:c.sid, p_player:c.pid, p_token:c.token, p_q:q, p_choice:choix}); }
  // Temps réel : simple « signal de rafraîchissement ». L'état fait toujours foi côté serveur.
  subscribe(sid, cb){
    const nom = 'ql85-' + sid;
    if (!this.canaux[nom]){
      const ch = this.sb.channel(nom, {config:{broadcast:{self:false}}});
      this.canaux[nom] = {ch, cbs:new Set()};
      ch.on('broadcast', {event:'etat'}, msg => this.canaux[nom] && this.canaux[nom].cbs.forEach(f => f(msg.payload)));
      ch.subscribe(st => { this.etats[nom] = st; });
    }
    this.canaux[nom].cbs.add(cb);
    return () => { const c = this.canaux[nom]; if (!c) return; c.cbs.delete(cb); if (!c.cbs.size){ this.sb.removeChannel(c.ch); delete this.canaux[nom]; } };
  }
  broadcast(sid, payload){ const c = this.canaux['ql85-' + sid]; if (c) c.ch.send({type:'broadcast', event:'etat', payload}).catch(() => {}); }
  tempsReelOk(sid){ return this.etats['ql85-' + sid] === 'SUBSCRIBED'; }
}

class DemoApi {
  constructor(){
    this.demo = true; this.n = 0;
    this.db = {quizzes:QUIZ_EXEMPLES.map((q, i) => Object.assign(clone(q), {id:this.id(), updated_at:new Date(Date.now() - i * 60000).toISOString()})), sessions:[], players:[], answers:[]};
    this.bots = {}; this.plans = {}; this.subs = {};
    setInterval(() => this.tick(), 200);
  }
  id(){ return 'd' + (++this.n) + Math.random().toString(36).slice(2, 8); }
  ok(v){ return Promise.resolve(clone(v)); }
  sess(id){ const s = this.db.sessions.find(x => x.id === id); if (!s) throw new Error('session_introuvable'); return s; }
  rem(s){ return s.phase === 'question' && s.q_started_at ? s.q_duration_ms - Math.floor((s.paused_at || Date.now()) - s.q_started_at) : null; }
  joueurs(sid){ return this.db.players.filter(p => p.session_id === sid); }
  reps(sid, q){ return this.db.answers.filter(a => a.session_id === sid && a.q_index === q); }
  dernier(s){ return s.phase === 'attente' ? -1 : s.phase === 'question' ? s.q_index - 1 : s.q_index; }
  notees(s, last){ return s.quiz.questions.filter((q, i) => i <= last && q.type !== 'sondage').length; }
  fermer(s){
    if (s.phase !== 'question') return;
    const q = s.quiz.questions[s.q_index];
    this.joueurs(s.id).forEach(p => { const a = this.db.answers.find(x => x.player_id === p.id && x.q_index === s.q_index);
      p.prev_score = p.score; p.score += a ? a.points : 0;
      p.streak = q.type === 'sondage' ? p.streak : (a && a.correct ? p.streak + 1 : 0); });
    s.phase = 'revel'; s.paused_at = null;
  }
  auto(s){ if (s.phase === 'question' && !s.paused_at && this.rem(s) < -1500) this.fermer(s); }
  histoire(s){
    const h = [];
    for (let i = 0; i <= this.dernier(s); i++){ const r = this.reps(s.id, i), q = s.quiz.questions[i];
      h.push({q_index:i, note:q.type !== 'sondage', repondants:r.length, correct:r.filter(a => a.correct).length,
        avg_ms: r.length ? Math.round(r.reduce((t, a) => t + a.elapsed_ms, 0) / r.length) : 0,
        counts: q.reponses.map((_, k) => r.filter(a => a.choice.includes(k)).length)}); }
    return h;
  }
  tri(sid){ return this.joueurs(sid).sort((a, b) => b.score - a.score || a.joined_at - b.joined_at); }
  // --- formateur
  async user(){ return {email:'demo'}; }
  async signIn(){ return {email:'demo'}; }
  async signOut(){}
  listQuizzes(){ return this.ok([...this.db.quizzes].sort((a, b) => b.updated_at.localeCompare(a.updated_at))); }
  saveQuiz(q){
    let x = q.id && this.db.quizzes.find(z => z.id === q.id);
    if (!x){ x = {id:this.id()}; this.db.quizzes.push(x); }
    Object.assign(x, {titre:(q.titre || '').trim() || 'Sans titre', theme:q.theme || 'Autre', questions:clone(q.questions), updated_at:new Date().toISOString()});
    return this.ok(x.id);
  }
  deleteQuiz(id){ this.db.quizzes = this.db.quizzes.filter(q => q.id !== id); return this.ok(null); }
  createSession(quizId, settings){
    const qz = this.db.quizzes.find(q => q.id === quizId); if (!qz) return Promise.reject(new Error('quiz_introuvable'));
    if (!qz.questions.length) return Promise.reject(new Error('quiz_vide'));
    let pin; do { pin = String(Math.floor(100000 + Math.random() * 900000)); } while (this.db.sessions.some(s => s.pin === pin && !s.ended_at));
    const s = {id:this.id(), pin, quiz:{titre:qz.titre, theme:qz.theme, questions:clone(qz.questions)}, settings:clone(settings || {}), phase:'attente', q_index:-1, q_started_at:null, q_duration_ms:null, paused_at:null, created_at:new Date().toISOString(), ended_at:null};
    this.db.sessions.push(s);
    // Participants simulés : ils rejoignent un par un, comme une vraie salle
    let t = 700; [...NOMS_BOTS].sort(() => Math.random() - .5).forEach(nom => { t += rnd(300, 1000);
      setTimeout(async () => { const r = await this.joinSession(pin, nom); if (r.ok) this.bots[r.player_id] = {token:r.token, niveau:rnd(.45, .92)}; }, t); });
    return this.ok({id:s.id, pin});
  }
  hostState(sid, full){
    const s = this.sess(sid); this.auto(s);
    const st = {id:s.id, pin:s.pin, phase:s.phase, q_index:s.q_index, settings:s.settings, total:s.quiz.questions.length, remaining_ms:this.rem(s), duration_ms:s.q_duration_ms, paused:!!s.paused_at,
      players:this.tri(sid).map(p => ({id:p.id, nickname:p.nickname, score:p.score, prev_score:p.prev_score, streak:p.streak})),
      answers_count:this.reps(sid, s.q_index).length, history:this.histoire(s)};
    if (full) st.quiz = s.quiz;
    return this.ok(st);
  }
  hostAction(sid, a, arg){
    const s = this.sess(sid); this.auto(s);
    if (a === 'start'){
      const i = arg && arg.index != null ? arg.index : s.q_index + 1;
      if (!['attente','revel','classement'].includes(s.phase) || i < 0 || i >= s.quiz.questions.length) return Promise.reject(new Error('action_impossible'));
      Object.assign(s, {phase:'question', q_index:i, q_started_at:Date.now() + 2500, q_duration_ms:Math.max(5, s.quiz.questions[i].duree || 20) * 1000, paused_at:null});
    } else if (a === 'close') this.fermer(s);
    else if (a === 'pause'){ if (s.phase === 'question' && !s.paused_at) s.paused_at = Date.now(); }
    else if (a === 'resume'){ if (s.paused_at){ s.q_started_at += Date.now() - s.paused_at; s.paused_at = null; } }
    else if (a === 'add_time'){ if (s.phase === 'question') s.q_duration_ms += Math.min(60, Math.max(1, (arg && arg.seconds) || 10)) * 1000; }
    else if (a === 'leaderboard'){ if (s.phase === 'revel') s.phase = 'classement'; }
    else if (a === 'podium'){ this.fermer(s); s.phase = 'podium'; s.ended_at = s.ended_at || new Date().toISOString(); }
    else if (a === 'kick'){ this.db.players = this.db.players.filter(p => !(p.id === arg.player_id && p.session_id === sid)); }
    return this.hostState(sid, false);
  }
  listSessions(){
    return this.ok(this.db.sessions.slice().reverse().map(s => { const n = this.joueurs(s.id).length, last = this.dernier(s), nb = this.notees(s, last);
      const ok = this.db.answers.filter(a => a.session_id === s.id && a.correct).length;
      return {id:s.id, pin:s.pin, titre:s.quiz.titre, phase:s.phase, created_at:s.created_at, players:n, taux: n * nb ? Math.round(100 * ok / (n * nb)) : null}; }));
  }
  sessionResults(sid){
    const s = this.sess(sid), anon = !!s.settings.anonyme;
    return this.ok({id:s.id, pin:s.pin, phase:s.phase, created_at:s.created_at, settings:s.settings, titre:s.quiz.titre,
      questions:s.quiz.questions.map(q => { const c = clone(q); delete c.imageData; return c; }), history:this.histoire(s), players_count:this.joueurs(sid).length,
      players: anon ? [] : this.tri(sid).map(p => ({nickname:p.nickname, score:p.score,
        answers:Object.fromEntries(this.db.answers.filter(a => a.player_id === p.id).map(a => [String(a.q_index), {choice:a.choice, correct:a.correct, points:a.points}]))}))});
  }
  // --- participant
  ouverte(pin){ return this.db.sessions.filter(s => s.pin === String(pin).trim() && !s.ended_at && s.phase !== 'podium').pop(); }
  checkPin(pin){ const s = this.ouverte(pin); return this.ok(s ? {ok:true, anonyme:!!s.settings.anonyme, titre:s.quiz.titre} : {ok:false, reason:'pin'}); }
  joinSession(pin, nick){
    const s = this.ouverte(pin); if (!s) return this.ok({ok:false, reason:'pin'});
    const pris = n => this.joueurs(s.id).some(p => p.nickname.toLowerCase() === n.toLowerCase());
    let v;
    if (s.settings.anonyme){ let k = 0; do { v = pick(PSEUDOS_ALEA.slice(0, 10)) + ' ' + Math.floor(rnd(10, 100)); } while (pris(v) && ++k < 60); }
    else {
      v = String(nick || '').trim().replace(/\s+/g, ' ');
      if (v.length < 1 || v.length > 16) return this.ok({ok:false, reason:'pseudo_longueur'});
      if (/(^|[^a-zà-ÿ])(con|connard|connasse|pute|putain|salope|encul|merde|nazi|bite|pd|fdp|ntm|batard|bâtard)([^a-zà-ÿ]|$)/i.test(v)) return this.ok({ok:false, reason:'pseudo_interdit'});
      if (pris(v)) return this.ok({ok:false, reason:'pseudo_pris'});
    }
    const p = {id:this.id(), session_id:s.id, nickname:v, token:this.id(), score:0, prev_score:0, streak:0, joined_at:Date.now() + Math.random()};
    this.db.players.push(p);
    return this.ok({ok:true, session_id:s.id, player_id:p.id, token:p.token, nickname:v});
  }
  joueur(c){ return this.db.players.find(p => p.id === c.pid && p.session_id === c.sid && p.token === c.token); }
  playerState(c){
    let p = this.joueur(c); if (!p) return this.ok({ok:false, reason:'inconnu'});
    const s = this.sess(c.sid); this.auto(s);
    const comp = s.settings.competition !== false, n = this.joueurs(s.id).length;
    const st = {ok:true, phase:s.phase, q_index:s.q_index, total:s.quiz.questions.length, titre:s.quiz.titre, remaining_ms:this.rem(s), duration_ms:s.q_duration_ms, paused:!!s.paused_at,
      competition:comp, question_tel:s.settings.questionTel !== false, nickname:p.nickname, score:p.score, streak:p.streak, players:n};
    if (s.q_index >= 0){
      const q = s.quiz.questions[s.q_index];
      st.question = {type:q.type, texte:q.texte, reponses:q.reponses, competence:q.competence};
      const a = this.db.answers.find(x => x.player_id === p.id && x.q_index === s.q_index);
      if (a) st.my_choice = a.choice;
      if (['revel','classement','podium'].includes(s.phase)) st.result = {repondu:!!a, correct:a ? a.correct : null, points:a ? a.points : 0, bonus:a ? a.bonus : 0, bonnes:q.bonnes, explication:q.explication};
    }
    if (comp){ const devant = this.joueurs(s.id).filter(x => x.score > p.score || (x.score === p.score && x.joined_at < p.joined_at));
      st.rank = devant.length + 1; const proche = devant.sort((a, b) => a.score - b.score || b.joined_at - a.joined_at)[0];
      st.ahead_nickname = proche ? proche.nickname : null; st.ahead_gap = proche ? proche.score - p.score : null; }
    if (s.phase === 'podium'){ st.correct_count = this.db.answers.filter(a => a.player_id === p.id && a.correct).length; st.scored_count = this.notees(s, this.dernier(s)); }
    return this.ok(st);
  }
  submitAnswer(c, qi, choix){
    const p = this.joueur(c); if (!p) return this.ok({ok:false, reason:'inconnu'});
    const s = this.sess(c.sid); this.auto(s);
    if (s.phase !== 'question' || s.q_index !== qi) return this.ok({ok:false, reason:'fermee'});
    if (s.paused_at) return this.ok({ok:false, reason:'pause'});
    const rem = this.rem(s);
    if (rem > s.q_duration_ms) return this.ok({ok:false, reason:'pas_commencee'});
    if (rem < -1500) return this.ok({ok:false, reason:'temps'});
    const q = s.quiz.questions[qi], n = q.reponses.length;
    if (!Array.isArray(choix) || !choix.length || choix.some(k => k < 0 || k >= n) || (q.type !== 'multi' && choix.length !== 1)) return this.ok({ok:false, reason:'choix_invalide'});
    if (this.db.answers.some(a => a.player_id === p.id && a.q_index === qi)) return this.ok({ok:false, reason:'deja'});
    const el = Math.max(0, Math.min(s.q_duration_ms, s.q_duration_ms - rem));
    const pickd = [...new Set(choix)].sort((a, b) => a - b);
    let ok = null, pts = 0, bonus = 0;
    if (q.type !== 'sondage'){ ok = q.bonnes.length > 0 && memeEnsemble(pickd, q.bonnes); if (ok) ({points:pts, bonus} = pointsReponse(q, el, s.q_duration_ms, p.streak)); }
    this.db.answers.push({session_id:s.id, player_id:p.id, q_index:qi, choice:pickd, elapsed_ms:el, correct:ok, points:pts, bonus});
    return this.ok({ok:true});
  }
  subscribe(sid, cb){ (this.subs[sid] = this.subs[sid] || new Set()).add(cb); return () => this.subs[sid].delete(cb); }
  broadcast(sid, payload){ setTimeout(() => (this.subs[sid] || []).forEach(f => f(payload)), 30); }
  tempsReelOk(){ return true; }
  // Les participants simulés répondent pendant le chrono
  tick(){
    this.db.sessions.forEach(s => {
      this.auto(s);
      if (s.phase !== 'question' || s.paused_at) return;
      const rem = this.rem(s); if (rem > s.q_duration_ms) return;
      const q = s.quiz.questions[s.q_index], cle = s.id + ':' + s.q_index;
      if (!this.plans[cle]){
        this.plans[cle] = {};
        this.joueurs(s.id).forEach(p => { const b = this.bots[p.id]; if (!b || Math.random() > .94) return;
          const juste = Math.random() < b.niveau * (q.coef > 1 ? .85 : 1);
          let choix;
          if (q.type === 'sondage') choix = [Math.random() < .55 ? 0 : Math.random() < .7 ? 1 : 2];
          else if (juste) choix = [...q.bonnes];
          else { const faux = q.reponses.map((_, i) => i).filter(i => !q.bonnes.includes(i)); choix = q.type === 'multi' ? [q.bonnes[0], ...(faux.length ? [faux[0]] : [])].filter(v => v != null) : [pick(faux.length ? faux : [0])]; }
          this.plans[cle][p.id] = {t:rnd(1500, s.q_duration_ms * .8), choix, token:b.token}; });
      }
      const ecoule = s.q_duration_ms - rem;
      Object.entries(this.plans[cle]).forEach(([pid, pl]) => { if (!pl.fait && pl.t <= ecoule){ pl.fait = true; this.submitAnswer({sid:s.id, pid, token:pl.token}, s.q_index, pl.choix); } });
    });
  }
}

    <div class="trio">
      <div class="champ"><label for="duree-q">Durée</label><select id="duree-q" data-act="champ-q" data-k="duree" data-num="1">${[10,15,20,25,30,45,60,90].map(d => `<option value="${d}" ${d === q.duree ? 'selected' : ''}>${d} secondes</option>`).join('')}</select></div>
      <div class="champ"><label for="coef-q">Coefficient de points</label><select id="coef-q" data-act="champ-q" data-k="coef" data-num="1" ${q.type === 'sondage' ? 'disabled' : ''}>${[1,2,3].map(c => `<option value="${c}" ${c === q.coef ? 'selected' : ''}>× ${c}${['',' (standard)',' (difficile)',' (expert)'][c]}</option>`).join('')}</select></div>

function changerType(q, t){

function reduireImage(fichier){
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .8)); };
      img.onerror = ko; img.src = lecteur.result; };
    lecteur.onerror = ko; lecteur.readAsDataURL(fichier);
  });
}

function tickHote(now){

    <tbody>${R.players.map((p,i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(p.nickname)}</b></td><td class="num">${fmt(p.score)}</td><td class="num">${Object.values(p.answers).filter(a => a.correct).length}/${notes.length}</td>
      ${R.history.map(h => { const a = p.answers[String(h.q_index)]; return `<td>${!a ? '<span class="etiquette">—</span>' : a.correct === null ? '<span class="etiquette">avis</span>' : a.correct ? '<span style="color:var(--ok);font-weight:700">✓</span>' : '<span style="color:var(--ko);font-weight:700">✗</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`}`;
}
function telecharger(nom, texte){
  try { const b = new Blob(['﻿' + texte], {type:'text/csv;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return true; }
  catch(e){ return false; }
}
